// ===== types.ts =====
type LeadSource = 'Thumbtack' | 'Angi' | 'Bark';
type CleaningFrequency = 'weekly' | 'biweekly' | 'monthly';

interface CallStage {
  id: number;
  key: string;
  name: string;
  summary: string;
  goal: string;
  soundLike: string[];
  watchOuts: string[];
  selfCheck: string;
  sourceSpecificCues?: Record<LeadSource, string>;
  mandatoryWording?: string;
  quickChecklist: string[];
}

interface ObjectionBranch {
  id: number;
  triggerPhrases: string[];
  keywords: string[];
  concernTitle: string;
  category: 'price' | 'commitment' | 'uncertainty' | 'competitors' | 'trust' | 'operations' | 'boundary' | 'general' | 'faq' | 'value';
  acknowledge: string;
  clarifyingQuestion: string;
  verifiedResponse: string;
  nextStep: string;
  pairedValueStatement?: string;
  relatedFaq?: string;
  isFirmNo?: boolean;
  safePolicyNote?: string;
  deliveryCue?: string;
}

interface ValueStatement {
  id: string;
  title: string;
  spiels: string[];
  deliveryCue: string;
}

interface FAQItem {
  id: string;
  question: string;
  answer: string;
  checkQuestion?: string;
  prohibitedAction?: string;
  category: 'policy' | 'pricing' | 'service' | 'booking';
}

interface DiscoveryLevel {
  level: number;
  title: string;
  goal: string;
  questions: string[];
}

interface CallLog {
  id: string;
  traineeName: string;
  timestamp: number;
  leadSource: LeadSource;
  score: number; // 0 - 100
  passed: boolean; // score >= 75
  highlight?: string; // What went well
  opportunity?: string; // What will I try next time / mistake to fix
  skillFocus?: string;
}

interface TraineePerformance {
  traineeName: string;
  totalCalls: number;
  passedCalls: number;
  passRate: number; // percentage (0 - 100)
  lastCallTime: number;
  highlights: string[];
  opportunities: string[];
}

interface SaveAttemptTrackerProps {
  leadSource: LeadSource;
  completedAttempts: number[];
  onToggleAttempt: (attemptNumber: number) => void;
  onResetAttempts: () => void;
}

const SaveAttemptTracker: React.FC<SaveAttemptTrackerProps> = ({
  leadSource,
  completedAttempts,
  onToggleAttempt,
  onResetAttempts
}) => {
  const targetCount = LEAD_SOURCE_INFO[leadSource]?.requiredSavesCount || 3;
  const currentCount = completedAttempts.filter((num) => num <= targetCount).length;
  const isRequirementMet = currentCount >= targetCount;

  return (
    <div className="bg-white rounded-xl border border-[#E6C8B7] shadow-xs p-3.5 space-y-3">
      {/* Header Bar */}
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <div className="w-6 h-6 rounded-md bg-[#BA6A36] text-white flex items-center justify-center font-bold">
            <Target className="w-3.5 h-3.5" />
          </div>
          <span className="text-xs sm:text-sm font-extrabold text-[#1C3934]">
            Save-Attempt Tracker: <span className="text-[#BA6A36]">{leadSource}</span>
          </span>
          <span className="text-[10px] bg-[#E6C8B7]/60 text-[#1C3934] font-bold px-2 py-0.5 rounded-full">
            Required: {targetCount} {targetCount === 1 ? 'Attempt' : 'Attempts'}
          </span>
        </div>

        {completedAttempts.length > 0 && (
          <button
            type="button"
            onClick={onResetAttempts}
            className="text-xs text-[#BA6A36] hover:underline flex items-center gap-1 font-bold cursor-pointer"
          >
            <RotateCcw className="w-3 h-3" />
            <span>Reset</span>
          </button>
        )}
      </div>

      {/* Attempt Tabs */}
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
        {Array.from({ length: targetCount }).map((_, idx) => {
          const attemptNum = idx + 1;
          const isDone = completedAttempts.includes(attemptNum);

          return (
            <button
              key={attemptNum}
              type="button"
              onClick={() => onToggleAttempt(attemptNum)}
              className={`p-2.5 rounded-lg border text-xs font-bold transition-all cursor-pointer flex items-center justify-between ${
                isDone
                  ? 'bg-emerald-600 text-white border-emerald-700 shadow-xs'
                  : 'bg-[#F9EDF0] text-[#1C3934] border-[#E6C8B7] hover:bg-[#E6C8B7]/40'
              }`}
            >
              <div className="flex items-center gap-1.5">
                <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-black ${
                  isDone ? 'bg-white text-emerald-800' : 'bg-[#E6C8B7] text-[#1C3934]'
                }`}>
                  {attemptNum}
                </span>
                <span>Attempt {attemptNum}</span>
              </div>

              <span className={`text-[10px] uppercase tracking-wider font-extrabold px-1.5 py-0.5 rounded ${
                isDone ? 'bg-white/20 text-white' : 'bg-white text-[#261311]/60 border border-[#E6C8B7]'
              }`}>
                {isDone ? '✓ Made' : 'Click if Made'}
              </span>
            </button>
          );
        })}
      </div>

      {/* Status Banner */}
      {isRequirementMet ? (
        <div className="bg-emerald-50 border border-emerald-400 rounded-lg p-2.5 text-emerald-950 text-xs flex items-center gap-2">
          <CheckCircle2 className="w-4 h-4 text-emerald-600 shrink-0" />
          <div className="leading-snug">
            <span className="font-extrabold text-emerald-800 mr-1">
              🎉 Requirement Met ({currentCount} / {targetCount} on {leadSource})!
            </span>
            <span>If the customer is still hesitant, you are now cleared to schedule a firm callback (confirm day, time, timezone, and phone number).</span>
          </div>
        </div>
      ) : (
        <div className="bg-amber-50 border border-amber-300 rounded-lg p-2.5 text-amber-950 text-xs flex items-center gap-2">
          <AlertCircle className="w-4 h-4 text-amber-600 shrink-0" />
          <div className="leading-snug">
            <span className="font-bold text-amber-900 mr-1">
              ⚠️ {currentCount} of {targetCount} required attempts made on {leadSource}.
            </span>
            <span className="text-amber-900/80">
              {leadSource === 'Angi'
                ? 'Angi requires at least 1 genuine attempt before scheduling a callback.'
                : `VoiceLab requires at least 3 genuine attempts on ${leadSource} before scheduling a callback.`}
            </span>
          </div>
        </div>
      )}
    </div>
  );
};

const APPROVED_FIRST_CLEAN_RATES: Record<number, number> = {
  2: 19,

  4: 38, // $19 membership (3h) + $19 extra 1 hour
  6: 78  // $19 membership (3h) + $59 extra 3 hours
};

const APPROVED_SUBSEQUENT_HOURLY_RATE = 23; // ~$23/hr (already includes 15% transaction fee)

const APPROVED_SUBSEQUENT_VISIT_RATES: Record<number, number> = {
  2: 46,  // 2h × ~$23
  3: 69,  // 3h × ~$23
  4: 92,  // 4h × ~$23
  6: 138  // 6h × ~$23
};

const APPROVED_NATIONAL_AVERAGES: Record<number, number> = {
  2: 150,

  6: 450
};

const APPROVED_ETF_RATE_PER_HOUR = 35; // $35 per hour of first clean

// Monthly Fee: Standard $59 -> Concession $54 -> Floor Concession $49
const APPROVED_MF_OPTIONS = [
  { val: 59, label: '$59/mo', note: 'Standard' },
  { val: 54, label: '$54/mo', note: 'Concession 1' },
  { val: 49, label: '$49/mo', note: 'Floor concession' }
] as const;

// Commitment: Standard 6 paid months -> Floor Concession 4 paid months.
const APPROVED_MCT_OPTIONS = [
  { val: 6, label: '6 mos', note: 'Standard policy' },
  { val: 4, label: '4 mos', note: 'Floor concession' }
] as const;

  4: 252
};

interface ApprovedPricingSummary {
  hours: number;
  mf: number;
  mct: number;
  frequency: CleaningFrequency;
  frequencyPhrase: string;
  initialPrice: number;
  subsequentRate: number;
  nationalAvg: number;
  cleansPerMonth: number;
  monthlyCleaningCost: number;
  monthlyTotalWithFrequency: number;
  monthlyFormulaText: string;
  remainingCommitmentMonths: number;
  etfFee: number;
  completePriceExplanationScript: string;
  directPriceAnswerScript: string;
  holdingPhraseScript: string;
  isCustomUnverified?: boolean;
}

function getApprovedPricingSummary(
  hours = 3,
  mf = 59,
  mct = 6,
  frequency: CleaningFrequency = 'biweekly'
): ApprovedPricingSummary {
  const validHours = [2, 3, 4, 6].includes(hours) ? hours : 3;
  const validMf = [59, 54, 49].includes(mf) ? mf : 59;
  const validMct = mct === 4 ? 4 : 6;

  const frequencyPhrase =
    frequency === 'weekly'
      ? 'once a week'
      : frequency === 'monthly'
      ? 'monthly'
      : 'every other week';

  const initialPrice = APPROVED_FIRST_CLEAN_RATES[validHours] ?? 19;
  const subsequentRate = APPROVED_SUBSEQUENT_VISIT_RATES[validHours] ?? 69;
  const nationalAvg = APPROVED_NATIONAL_AVERAGES[validHours] ?? 225;
  const etfFee = validHours * APPROVED_ETF_RATE_PER_HOUR;

  const cleansPerMonth = frequency === 'weekly' ? 4 : frequency === 'biweekly' ? 2 : 1;
  const monthlyCleaningCost = subsequentRate * cleansPerMonth;
  const monthlyTotalWithFrequency = validMf + monthlyCleaningCost;
  const remainingCommitmentMonths = validMct - 1;

  const monthlyFormulaText = `$${validMf} MF + (${cleansPerMonth} visit${cleansPerMonth > 1 ? 's' : ''} × $${subsequentRate}) = ~$${monthlyTotalWithFrequency}/mo before tax`;

  const completePriceExplanationScript = `“Here is our complete pricing breakdown for your home: For your first ${validHours}-hour clean, you pay $${initialPrice} today, plus applicable taxes. That covers your first month of membership and includes your clean. Starting in month two, the ongoing membership is $${validMf} a month, plus applicable taxes. Your cleanings after the first are about $23 an hour, so for your ${validHours}-hour clean that is about $${subsequentRate} per visit, plus applicable taxes, which already includes the 15% transaction fee. With cleaning ${frequencyPhrase}, that works out to an estimated total of roughly $${monthlyTotalWithFrequency} a month before taxes. The membership commitment is ${validMct} paid months. You can cancel anytime, and if you cancel before ${validMct} paid months, the early cancellation fee is $35 per hour of your first clean, which is $${etfFee}, plus applicable taxes. Would Friday morning or Saturday morning works best for you?”`;

  const directPriceAnswerScript = validHours > 3
    ? `“For your home (${validHours} hours), your first visit, you'd pay $${initialPrice} today, plus applicable taxes. $19 is your first month of membership, which includes 3 hours, and $${initialPrice - 19}, plus applicable taxes, covers the extra ${validHours - 3} hour${validHours - 3 > 1 ? 's' : ''} your home needs. But I want to make sure it fits, so I'll be asking a few quick questions.”`
    : `“For your home (${validHours} hours), your first visit, you'd pay $19 today, plus applicable taxes. That $19 is your first month of membership, which includes your ${validHours} hours of cleaning. But I want to make sure it fits, so I'll be asking a few quick questions.”`;

  const holdingPhraseScript = `“Let me verify that so I give you the correct total.”`;

  return {
    hours: validHours,
    mf: validMf,
    mct: validMct,
    frequency,
    frequencyPhrase,
    initialPrice,
    subsequentRate,
    nationalAvg,
    cleansPerMonth,
    monthlyCleaningCost,
    monthlyTotalWithFrequency,
    monthlyFormulaText,
    remainingCommitmentMonths,
    etfFee,
    completePriceExplanationScript,
    directPriceAnswerScript,
    holdingPhraseScript,
    isCustomUnverified: false
  };
}

interface GuidedCallFlowProps {
  leadSource: LeadSource;
  selectedHours?: number;
  onChangeHours?: (hours: number) => void;
  selectedMf?: number;
  onChangeMf?: (mf: number) => void;
  selectedMct?: number;
  onChangeMct?: (mct: number) => void;
  selectedFrequency?: CleaningFrequency;
  onChangeFrequency?: (frequency: CleaningFrequency) => void;
}

const GuidedCallFlow: React.FC<GuidedCallFlowProps> = ({
  leadSource,
  selectedHours: propHours,
  onChangeHours,
  selectedMf: propMf,
  onChangeMf,
  selectedMct: propMct,
  onChangeMct,
  selectedFrequency: propFrequency,
  onChangeFrequency
}) => {
  const [internalHours, setInternalHours] = useState<number>(3);
  const [internalMf, setInternalMf] = useState<number>(59);
  const [internalMct, setInternalMct] = useState<number>(6);
  const [internalFrequency, setInternalFrequency] = useState<CleaningFrequency>('biweekly');

  const selectedHours = propHours ?? internalHours;
  const setSelectedHours = (val: number) => {
    if (onChangeHours) onChangeHours(val);
    else setInternalHours(val);
  };

  const selectedMf = propMf ?? internalMf;
  const setSelectedMf = (val: number) => {
    if (onChangeMf) onChangeMf(val);
    else setInternalMf(val);
  };

  const selectedMct = propMct ?? internalMct;
  const setSelectedMct = (val: number) => {
    if (onChangeMct) onChangeMct(val);
    else setInternalMct(val);
  };

  const selectedFrequency = propFrequency ?? internalFrequency;
  const setSelectedFrequency = (val: CleaningFrequency) => {
    if (onChangeFrequency) onChangeFrequency(val);
    else setInternalFrequency(val);
  };

  const [currentStepIndex, setCurrentStepIndex] = useState<number>(0);
  const [copiedKey, setCopiedKey] = useState<string | null>(null);
  const [showDirectPriceDrawer, setShowDirectPriceDrawer] = useState<boolean>(false);
  const [showCompleteBreakdown, setShowCompleteBreakdown] = useState<boolean>(false);

  const pricing = getApprovedPricingSummary(
    selectedHours,
    selectedMf,
    selectedMct,
    selectedFrequency
  );

  const {
    initialPrice,
    subsequentRate,
    monthlyTotalWithFrequency,
    monthlyFormulaText,
    remainingCommitmentMonths,
    etfFee,
    completePriceExplanationScript,
    directPriceAnswerScript,
    holdingPhraseScript
  } = pricing;

  const steps: CallFlowStep[] = GET_LEAD_CALL_FLOW(
    leadSource,
    selectedHours,
    selectedMf,
    selectedMct,
    selectedFrequency
  );
  const safeStepIndex = Math.min(currentStepIndex, Math.max(0, steps.length - 1));
  const activeStep = steps[safeStepIndex] || steps[0];

  const handleCopy = (text: string, key: string) => {
    navigator.clipboard.writeText(text);
    setCopiedKey(key);
    setTimeout(() => setCopiedKey(null), 2000);
  };

  const frequencyDisplayName =
    selectedFrequency === 'weekly'
      ? 'Weekly (4x/mo)'
      : selectedFrequency === 'biweekly'
      ? 'Bi-weekly (2x/mo)'
      : 'Monthly (1x/mo)';

    <div className="bg-white rounded-xl border border-[#E6C8B7] shadow-sm overflow-hidden space-y-4">
      {/* Top Banner */}
      <div className="bg-[#1C3934] text-[#F9EDF0] p-4 flex flex-col gap-3">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-[#C3955B]/30 pb-3">
          <div>
            <div className="flex items-center gap-2">
              <PhoneCall className="w-5 h-5 text-[#BA6A36]" />
              <h2 className="text-base sm:text-lg font-extrabold tracking-tight">

              <span className="text-[10px] bg-[#C3955B] text-[#261311] font-extrabold uppercase px-2 py-0.5 rounded">
                NLS Confirmed Rules
              </span>
            </div>
            <p className="text-xs text-[#E6C8B7] mt-0.5">

            <button
              type="button"
              onClick={() => setShowDirectPriceDrawer(!showDirectPriceDrawer)}

            >
              <Zap className="w-3.5 h-3.5 fill-current" />
              <span>Direct Price Fast-Track</span>
            </button>

            <button
              type="button"
              onClick={() => handleCopy(holdingPhraseScript, 'holding-phrase')}
              className="text-xs bg-[#261311]/70 hover:bg-[#261311] text-[#E6C8B7] hover:text-white px-2.5 py-1.5 rounded-lg font-semibold cursor-pointer border border-[#C3955B]/40 transition-colors flex items-center gap-1"
              title="Click to copy: 'Let me verify that so I give you the correct total.'"

// ===== objectionMatcher.ts =====



interface MatchResult {
  branch: ObjectionBranch;
  score: number;
  matchedKeywords: string[];
  confidence: 'high' | 'medium' | 'low';
  matchedReason?: string;
}

const STOP_WORDS = new Set([
  'a', 'about', 'above', 'after', 'again', 'against', 'all', 'am', 'an', 'and',
  'any', 'are', 'as', 'at', 'be', 'because', 'been', 'before', 'being', 'below',
  'between', 'both', 'by', 'could', 'did', 'do', 'does', 'doing', 'down', 'during',
  'each', 'few', 'for', 'from', 'further', 'had', 'has', 'have', 'having', 'he',
  'her', 'here', 'hers', 'herself', 'him', 'himself', 'his', 'how', 'i', 'if',
  'in', 'into', 'is', 'it', 'its', 'itself', 'just', 'me', 'more', 'most', 'my',
  'myself', 'of', 'off', 'on', 'once', 'only', 'or', 'other', 'our', 'ours',
  'ourselves', 'out', 'over', 'own', 'same', 'she', 'should', 'so', 'some', 'such',
  'than', 'that', 'the', 'their', 'theirs', 'them', 'themselves', 'then', 'there',
  'these', 'they', 'this', 'those', 'through', 'to', 'too', 'under', 'until', 'up',
  'very', 'was', 'we', 'were', 'what', 'when', 'where', 'which', 'while', 'who',
  'whom', 'why', 'will', 'with', 'would', 'you', 'your', 'yours', 'yourself'
]);

function levenshteinDistance(s1: string, s2: string): number {
  if (s1 === s2) return 0;
  if (s1.length === 0) return s2.length;
  if (s2.length === 0) return s1.length;

  const matrix: number[][] = [];
  for (let i = 0; i <= s2.length; i++) {
    matrix[i] = [i];
  }
  for (let j = 0; j <= s1.length; j++) {
    matrix[0][j] = j;
  }

  for (let i = 1; i <= s2.length; i++) {
    for (let j = 1; j <= s1.length; j++) {
      if (s2.charAt(i - 1) === s1.charAt(j - 1)) {
        matrix[i][j] = matrix[i - 1][j - 1];
      } else {
        matrix[i][j] = Math.min(
          matrix[i - 1][j - 1] + 1,
          matrix[i][j - 1] + 1,
          matrix[i - 1][j] + 1
        );
      }
    }
  }

  return matrix[s2.length][s1.length];
}

function normalize(text: string): string {
  return text
    .toLowerCase()
    .replace(/[^\w\s$]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function matchCustomerUtterance(input: string): MatchResult[] {
  const rawInput = input.trim();
  if (!rawInput) return [];

  const normalized = normalize(rawInput);
  const inputWords = normalized.split(/\s+/).filter((w) => w.length > 0);
  const meaningfulWords = inputWords.filter((w) => !STOP_WORDS.has(w) || w === 'no' || w === 'not');

  const scoredMap = new Map<number, { score: number; keywords: string[]; reason: string }>();

  function addScore(branchId: number, points: number, keyword: string, reason?: string) {
    const existing = scoredMap.get(branchId) || { score: 0, keywords: [], reason: '' };
    existing.score += points;
    if (keyword && !existing.keywords.includes(keyword)) {
      existing.keywords.push(keyword);
    }
    if (reason && !existing.reason) {
      existing.reason = reason;
    }
    scoredMap.set(branchId, existing);
  }

  // 1. Broad Intent Detection Rules (Regex)
  if (/(stop calling|do not call|don't call|remove me|take me off|not interested|no thanks|never call|lose my number|unsubscribe|harass|leave me alone|please don't|stop texting|quit calling|\bno\b|\bnope\b)/i.test(normalized)) {
    addScore(21, 150, 'Firm No / Stop Contacting', 'Customer stated firm no or requested to stop calling');
  }

      if (normalized.includes(phraseNorm)) {
        addScore(branch.id, 80, phrase, `Matched trigger phrase: "${phrase}"`);
      }
    }

    for (const kw of branch.keywords) {
      const kwNorm = normalize(kw);
      if (!kwNorm) continue;

      if (normalized.includes(kwNorm)) {
        addScore(branch.id, 25, kw, `Matched keyword: "${kw}"`);
      } else {
        for (const inputWord of meaningfulWords) {
          if (inputWord.length >= 4 && kwNorm.length >= 4) {
            const dist = levenshteinDistance(inputWord, kwNorm);
            if (dist <= 1 || (dist <= 2 && kwNorm.length >= 7)) {
              addScore(branch.id, 20, kw, `Fuzzy match on "${inputWord}" ~ "${kw}"`);
            }
          }
        }
      }
    }

    const titleWords = normalize(branch.concernTitle).split(/\s+/).filter((w) => !STOP_WORDS.has(w));
    for (const tw of titleWords) {
      if (tw.length >= 4 && normalized.includes(tw)) {
        addScore(branch.id, 15, tw);
      }
    }
  }

  const results: MatchResult[] = [];

  for (const branch of OBJECTION_PLAYBOOK) {
    const scored = scoredMap.get(branch.id);
    if (scored && scored.score > 0) {
      const confidence: 'high' | 'medium' | 'low' =
        scored.score >= 80 ? 'high' : scored.score >= 35 ? 'medium' : 'low';
      results.push({
        branch,
        score: scored.score,
        matchedKeywords: scored.keywords,
        confidence,
        matchedReason: scored.reason
      });
    }
  }

  results.sort((a, b) => b.score - a.score);

  if (results.length === 0 && rawInput.length > 0) {

          nextStep: '“If you are still looking for cleaning help, I can check open days this week. If it was placed by mistake, I can immediately update your preferences so you aren’t contacted again.”'
        },
        score: 40,
        matchedKeywords: ['caller identification'],
        confidence: 'medium',
        matchedReason: 'Customer asked who is calling or referenced caller identity'
      });
    } else {
      const fallbackBranch = OBJECTION_PLAYBOOK.find((b) => b.id === 4) || OBJECTION_PLAYBOOK[0];
      results.push({
        branch: {
          ...fallbackBranch,
          concernTitle: 'Customer Question / General Inquiry',
          acknowledge: '“I completely understand. I want to make sure you have all the facts and clear numbers for your home.”',
          clarifyingQuestion: '“Just so I can give you the exact details, what is the biggest thing on your mind right now—the pricing, how the schedule works, or the cleaning scope?”',

          nextStep: '“Does that give you a helpful overview, or would you like to check what dates are open in your ZIP code this week?”'
        },
        score: 20,
        matchedKeywords: ['general inquiry'],
        confidence: 'low',
        matchedReason: 'Closest general inquiry response based on your query'
      });
    }
  }

  return results;
}

const VALUE_STATEMENTS: ValueStatement[] = VALUE_STATEMENTS_BY_SOURCE.Bark;

function getVerbatimValueStatement(
  category: 'price' | 'commitment' | 'uncertainty' | 'competitors' | 'trust' | 'operations' | 'boundary' | 'faq' | 'general' | 'value',
  leadSource: LeadSource,
  spielIndex = 0,
  hours = 3,
  mf = 59,
  _mct = 6,
  frequency: CleaningFrequency = 'biweekly'
): { title: string; spiel: string; allSpiels: string[]; categoryId: string } {
  const sourceStatements = VALUE_STATEMENTS_BY_SOURCE[leadSource] || VALUE_STATEMENTS_BY_SOURCE.Bark;

  let targetId = 'price-and-value';
  if (category === 'trust') {
    targetId = 'vetted-cleaners';
  } else if (category === 'competitors') {
    targetId = 'vetted-cleaners';
  } else if (category === 'uncertainty' || category === 'commitment') {
    targetId = 'schedule-flexibility';
  } else if (category === 'operations') {
    targetId = 'cleaner-availability';
  } else if (category === 'faq') {
    targetId = 'support-24-7';
  } else if (category === 'boundary') {
    targetId = 'schedule-flexibility';
  }

  const found = sourceStatements.find((vs) => vs.id === targetId) || sourceStatements[1];
  const safeIndex = spielIndex % found.spiels.length;
  let rawSpiel = found.spiels[safeIndex];

  const freqPhrase =
    frequency === 'weekly'
      ? 'once a week'
      : frequency === 'monthly'
      ? 'monthly'
      : 'every other week';
  const subsequentRate = hours === 2 ? 46 : hours === 3 ? 69 : hours === 4 ? 92 : 138;
  const cleansPerMonth = frequency === 'weekly' ? 4 : frequency === 'biweekly' ? 2 : 1;
  const total = mf + (subsequentRate * cleansPerMonth);

  rawSpiel = rawSpiel
    .replace(/\(frequency\)/gi, freqPhrase)
    .replace(/\(all-in monthly total\)/gi, `$${total}`);

  return {
    title: found.title,
    spiel: rawSpiel,
    allSpiels: found.spiels.map((s) =>
      s.replace(/\(frequency\)/gi, freqPhrase).replace(/\(all-in monthly total\)/gi, `$${total}`)
    ),
    categoryId: found.id
  };
}

const SimpleDashboard: React.FC<SimpleDashboardProps> = ({
  logs,
  onAddLog,
  onDeleteLog,
  onDeleteTrainee,
  onClearAllLogs,
  activeTrainee,
  onSelectTrainee,
  currentLeadSource,
  isSyncing
}) => {
  const [traineeNameInput, setTraineeNameInput] = useState(activeTrainee || '');
  const [scoreInput, setScoreInput] = useState<number | ''>(85);
  const [selectedSource, setSelectedSource] = useState<LeadSource>(currentLeadSource);
  const [highlightInput, setHighlightInput] = useState('');
  const [opportunityInput, setOpportunityInput] = useState('');

  const [confirmDeleteTrainee, setConfirmDeleteTrainee] = useState<string | null>(null);
  const [confirmDeleteLogId, setConfirmDeleteLogId] = useState<string | null>(null);
  const [confirmResetAll, setConfirmResetAll] = useState<boolean>(false);

  const traineeMap = new Map<string, { total: number; passed: number; lastTime: number; highlights: string[]; opportunities: string[] }>();

  logs.forEach((log) => {
    const name = log.traineeName.trim();
    if (!name) return;
    const existing = traineeMap.get(name) || {
      total: 0,
      passed: 0,
      lastTime: 0,
      highlights: [],
      opportunities: []
    };
    existing.total += 1;
    if (log.score >= 75) {
      existing.passed += 1;
    }
    if (log.timestamp > existing.lastTime) {
      existing.lastTime = log.timestamp;
    }
    if (log.highlight) {
      existing.highlights.push(log.highlight);
    }
    if (log.opportunity) {
      existing.opportunities.push(log.opportunity);
    }
    traineeMap.set(name, existing);
  });

  const performances: TraineePerformance[] = Array.from(traineeMap.entries())
    .map(([traineeName, data]) => ({
      traineeName,
      totalCalls: data.total,
      passedCalls: data.passed,
      passRate: data.total > 0 ? Math.round((data.passed / data.total) * 100) : 0,
      lastCallTime: data.lastTime,
      highlights: data.highlights,
      opportunities: data.opportunities
    }))
    .sort((a, b) => b.lastCallTime - a.lastCallTime);

  const selectedTraineeName = activeTrainee && traineeMap.has(activeTrainee)
    ? activeTrainee
    : performances[0]?.traineeName || '';

  const currentTraineeLogs = logs.filter(
    (l) => l.traineeName.toLowerCase() === selectedTraineeName.toLowerCase()
  );

  const traineeOpportunityCounts = new Map<string, number>();
  currentTraineeLogs.forEach((l) => {
    if (!l.opportunity) return;
    const trimmed = l.opportunity.trim();
    if (!trimmed) return;
    traineeOpportunityCounts.set(trimmed, (traineeOpportunityCounts.get(trimmed) || 0) + 1);
  });

  const traineeSortedOpportunities = Array.from(traineeOpportunityCounts.entries())
    .map(([text, count]) => ({ text, count }))
    .sort((a, b) => b.count - a.count);

  const traineeHighlightCounts = new Map<string, number>();
  currentTraineeLogs.forEach((l) => {
    if (!l.highlight) return;
    const trimmed = l.highlight.trim();
    if (!trimmed) return;
    traineeHighlightCounts.set(trimmed, (traineeHighlightCounts.get(trimmed) || 0) + 1);
  });

  const traineeSortedHighlights = Array.from(traineeHighlightCounts.entries())
    .map(([text, count]) => ({ text, count }))
    .sort((a, b) => b.count - a.count);

  const handleLogSubmit = (e: React.FormEvent) => {
    e.preventDefault();
    const cleanName = traineeNameInput.trim();
    if (!cleanName || scoreInput === '') return;

    const numScore = Math.min(100, Math.max(0, Number(scoreInput)));
    onAddLog({
      traineeName: cleanName,
      leadSource: selectedSource,
      score: numScore,
      highlight: highlightInput.trim() || undefined,
      opportunity: opportunityInput.trim() || undefined
    });

    onSelectTrainee(cleanName);
    setScoreInput('');
    setHighlightInput('');
    setOpportunityInput('');
  };

  return (
    <div className="bg-white rounded-xl border border-[#E6C8B7] p-5 shadow-sm space-y-6">
      {/* Header */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-[#E6C8B7] pb-4">
        <div className="flex items-center gap-2.5">
          <div className="w-8 h-8 rounded-lg bg-[#BA6A36] text-white flex items-center justify-center font-black">
            <BarChart3 className="w-5 h-5" />
          </div>
          <div>
            <div className="flex items-center gap-2">
              <h3 className="text-base sm:text-lg font-extrabold text-[#1C3934]">
                Trainee Performance & Coaching Dashboard
              </h3>
              <span className="text-[10px] bg-[#E6C8B7]/60 text-[#1C3934] font-bold px-2 py-0.5 rounded-full">
                75%+ Pass Benchmark
              </span>
              <span className="text-[10px] bg-emerald-100 text-emerald-800 border border-emerald-300 font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                <Globe className="w-3 h-3 text-emerald-600" />
                Live Cloud Sync Across All Devices
              </span>
            </div>
            <p className="text-xs text-[#261311]/70">
              Shared live across everyone who has the link. Call logs and coaching notes update in real time.
            </p>
          </div>
        </div>

        <div className="flex items-center gap-2 self-start sm:self-auto">
          {isSyncing && (
            <span className="text-[11px] text-emerald-700 font-medium flex items-center gap-1">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping" />
              Syncing...
            </span>
          )}

          {logs.length > 0 && (
            <div>
              {confirmResetAll ? (
                <div className="flex items-center gap-1.5 bg-red-50 p-1.5 rounded-lg border border-red-300 text-xs">
                  <span className="font-bold text-red-900">Clear all records?</span>
                  <button
                    type="button"
                    onClick={() => {
                      onClearAllLogs();
                      setConfirmResetAll(false);
                    }}
                    className="bg-red-700 text-white px-2 py-0.5 rounded text-[11px] font-bold cursor-pointer"
                  >
                    Yes, Reset All
                  </button>
                  <button
                    type="button"

                    Cancel
                  </button>
                </div>

                <button
                  type="button"
                  onClick={() => setConfirmResetAll(true)}
                  className="text-xs text-red-700 hover:text-red-900 flex items-center gap-1 bg-red-50 hover:bg-red-100 px-2.5 py-1 rounded-md border border-red-200 font-bold cursor-pointer transition-colors"
                >
                  <Trash2 className="w-3.5 h-3.5" />
                  <span>Reset All Data</span>
                </button>
              )}
            </div>
          )}
        </div>
      </div>

      {/* Trainees Performance Table */}
      <div>
        <div className="flex items-center justify-between mb-2">

        {performances.length === 0 ? (

                  <th className="py-2.5 px-3 font-bold uppercase tracking-wider">Trainee Name</th>

                </tr>
              </thead>
              <tbody className="divide-y divide-[#E6C8B7]/60 bg-white">
                {performances.map((p) => {

                  const isConfirming = confirmDeleteTrainee === p.traineeName;

                  return (

};
const FIRESTORE_DATABASE_ID = "ai-studio-voicelabcallcomp-f026f0ef-a2e8-480d-b6ed-0f2df14d4836";
const CALL_LOGS_COLLECTION = 'callLogs';

let sdkPromise: Promise<any> | null = null;
function getSdk(): Promise<any> {
  if (!sdkPromise) {
    sdkPromise = (async () => {
      const base = 'https://www.gstatic.com/firebasejs/' + FIREBASE_VERSION + '/';
      const appMod: any = await import(base + 'firebase-app.js');
      const fsMod: any = await import(base + 'firebase-firestore.js');
      const app = appMod.initializeApp(firebaseConfig);
      const db = fsMod.getFirestore(app, FIRESTORE_DATABASE_ID);
      return { fs: fsMod, db };
    })();
  }
  return sdkPromise;
}

async function testConnection(): Promise<boolean> {
  try {
    const { fs, db } = await getSdk();
    await fs.getDocFromServer(fs.doc(db, 'test', 'connection'));
    return true;
  } catch (error) {
    return false;
  }
}

function subscribeToCallLogs(onUpdate: (logs: CallLog[]) => void, onError?: (err: Error) => void) {
  let unsub: null | (() => void) = null;
  let cancelled = false;
  getSdk().then(({ fs, db }) => {
    if (cancelled) return;
    const q = fs.query(fs.collection(db, CALL_LOGS_COLLECTION), fs.orderBy('timestamp', 'desc'));
    unsub = fs.onSnapshot(
      q,
      (snapshot: any) => {
        const logs: CallLog[] = [];
        snapshot.forEach((docSnap: any) => {
          const data = docSnap.data();
          logs.push({
            id: docSnap.id,
            traineeName: data.traineeName,
            timestamp: data.timestamp,
            leadSource: data.leadSource,
            score: data.score,
            passed: data.passed,
            highlight: data.highlight || '',
            opportunity: data.opportunity || '',
            skillFocus: data.skillFocus || ''
          });
        });
        onUpdate(logs);
      },
      (error: Error) => {
        console.warn('Error listening to callLogs:', error);
        if (onError) onError(error);
      }
    );
  }).catch((err: Error) => {
    console.warn('Could not load Firebase:', err);
    if (onError) onError(err);
  });
  return () => {
    cancelled = true;
    if (unsub) unsub();
  };
}

async function saveCallLog(log: CallLog): Promise<void> {
  const { fs, db } = await getSdk();
  await fs.setDoc(fs.doc(db, CALL_LOGS_COLLECTION, log.id), {
    traineeName: log.traineeName,
    timestamp: log.timestamp,
    leadSource: log.leadSource,
    score: log.score,
    passed: log.passed,
    highlight: log.highlight || '',
    opportunity: log.opportunity || '',
    skillFocus: log.skillFocus || ''
  });
}

async function deleteCallLog(id: string): Promise<void> {
  const { fs, db } = await getSdk();
  await fs.deleteDoc(fs.doc(db, CALL_LOGS_COLLECTION, id));
}

async function deleteTraineeLogs(traineeName: string): Promise<void> {
  const { fs, db } = await getSdk();
  const snapshot = await fs.getDocs(fs.collection(db, CALL_LOGS_COLLECTION));
  const batch = fs.writeBatch(db);
  let count = 0;
  snapshot.forEach((docSnap: any) => {
    const data = docSnap.data();
    if (data.traineeName && data.traineeName.toLowerCase() === traineeName.toLowerCase()) {
      batch.delete(docSnap.ref);
      count++;
    }
  });
  if (count > 0) await batch.commit();
}

async function clearAllLogs(): Promise<void> {
  const { fs, db } = await getSdk();
  const snapshot = await fs.getDocs(fs.collection(db, CALL_LOGS_COLLECTION));
  const batch = fs.writeBatch(db);
  let count = 0;
  snapshot.forEach((docSnap: any) => { batch.delete(docSnap.ref); count++; });
  if (count > 0) await batch.commit();
}

const STORAGE_KEY_CALL_LOGS = 'voicelab_trainee_call_logs_v2';
const STORAGE_KEY_ACTIVE_TRAINEE = 'voicelab_active_trainee_v2';
const STORAGE_KEY_ACTIVE_LEAD = 'voicelab_active_lead_v2';

function App() {
  const [leadSource, setLeadSource] = useState<LeadSource>(() => {
    return (localStorage.getItem(STORAGE_KEY_ACTIVE_LEAD) as LeadSource) || 'Thumbtack';
  });

  const [activeTrainee, setActiveTrainee] = useState<string>(() => {
    return localStorage.getItem(STORAGE_KEY_ACTIVE_TRAINEE) || '';
  });

  const [hours, setHours] = useState<number>(3);
  const [mf, setMf] = useState<number>(59);
  const [mct, setMct] = useState<number>(6);
  const [frequency, setFrequency] = useState<CleaningFrequency>('biweekly');

  const [callLogs, setCallLogs] = useState<CallLog[]>(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY_CALL_LOGS);
      if (saved) {
        return JSON.parse(saved);
      }
    } catch (e) {
      console.error('Failed reading call logs from localStorage', e);
    }
    return [];
  });

  const [isSyncing, setIsSyncing] = useState<boolean>(true);
  const [isCloudConnected, setIsCloudConnected] = useState<boolean>(true);
  const [lastSyncedTime, setLastSyncedTime] = useState<Date | null>(null);
  const [completedAttempts, setCompletedAttempts] = useState<number[]>([]);
  const hasFirestoreSnapshotRef = useRef<boolean>(false);

  // Real-time synchronization with Firebase Firestore + local data/call_logs.json backup
  // Any call logged on mobile or laptop immediately synchronizes to all other devices in real time.
  useEffect(() => {
    setIsSyncing(true);

    // Load local data/call_logs.json immediately as fallback (or if running downloaded .zip offline)
    fetch('/api/calls')
      .then((res) => (res.ok ? res.json() : null))
      .then((localLogs) => {
        if (!hasFirestoreSnapshotRef.current && Array.isArray(localLogs) && localLogs.length > 0) {
          setCallLogs(localLogs);
          localStorage.setItem(STORAGE_KEY_CALL_LOGS, JSON.stringify(localLogs));
        }
      })
      .catch(() => {
        // Ignore if running without backend API
      });

    const unsubscribe = subscribeToCallLogs(
      (logs) => {
        hasFirestoreSnapshotRef.current = true;
        setCallLogs(logs);
        localStorage.setItem(STORAGE_KEY_CALL_LOGS, JSON.stringify(logs));
        setIsCloudConnected(true);
        setIsSyncing(false);
        setLastSyncedTime(new Date());

        // Keep data/call_logs.json mirrored with Firestore so downloaded .zip always includes latest logs
        fetch('/api/calls/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ logs })
        }).catch(() => {
          // Ignore if running without backend API
        });
      },
      (err) => {
        console.warn('Real-time listener notice:', err);
        setIsCloudConnected(false);
        setIsSyncing(false);
      }
    );

    return () => {
      unsubscribe();
    };
  }, []);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY_ACTIVE_LEAD, leadSource);
  }, [leadSource]);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY_ACTIVE_TRAINEE, activeTrainee);
  }, [activeTrainee]);

  const handleManualRefresh = async () => {
    setIsSyncing(true);
    await testConnection();
    setTimeout(() => {
      setIsSyncing(false);
      setLastSyncedTime(new Date());
    }, 600);
  };

  const handleAddLog = async (newLog: Omit<CallLog, 'id' | 'timestamp' | 'passed'>) => {
    const entry: CallLog = {
      ...newLog,
      id: 'call-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
      timestamp: Date.now(),
      passed: newLog.score >= 75
    };

    // Optimistic local update
    const updated = [entry, ...callLogs.filter((l) => l.id !== entry.id)];
    setCallLogs(updated);
    setActiveTrainee(newLog.traineeName);
    localStorage.setItem(STORAGE_KEY_CALL_LOGS, JSON.stringify(updated));

    // Mirror to local data/call_logs.json
    fetch('/api/calls', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entry)
    }).catch(() => {});

    // Save to Firestore so every device sees it instantly
    try {
      await saveCallLog(entry);
    } catch (err) {
      console.error('Error saving call log to Firestore:', err);
    }
  };

  const handleDeleteLog = async (id: string) => {
    setCallLogs((prev) => {
      const next = prev.filter((l) => l.id !== id);
      localStorage.setItem(STORAGE_KEY_CALL_LOGS, JSON.stringify(next));
      return next;
    });
    fetch(`/api/calls/${encodeURIComponent(id)}`, { method: 'DELETE' }).catch(() => {});
    try {
      await deleteCallLog(id);
    } catch (err) {
      console.error('Error deleting call log from Firestore:', err);
    }
  };

  const handleDeleteTrainee = async (traineeName: string) => {
    setCallLogs((prev) => {
      const next = prev.filter((l) => l.traineeName.toLowerCase() !== traineeName.toLowerCase());
      localStorage.setItem(STORAGE_KEY_CALL_LOGS, JSON.stringify(next));
      return next;
    });
    if (activeTrainee.toLowerCase() === traineeName.toLowerCase()) {
      setActiveTrainee('');
    }
    fetch(`/api/calls/trainee/${encodeURIComponent(traineeName)}`, { method: 'DELETE' }).catch(() => {});
    try {
      await deleteTraineeLogs(traineeName);
    } catch (err) {
      console.error('Error deleting trainee logs from Firestore:', err);
    }
  };

  const handleClearAllLogs = async () => {
    setCallLogs([]);
    setActiveTrainee('');
    localStorage.setItem(STORAGE_KEY_CALL_LOGS, JSON.stringify([]));
    fetch('/api/calls', { method: 'DELETE' }).catch(() => {});
    try {
      await clearAllLogs();
    } catch (err) {
      console.error('Error clearing call logs from Firestore:', err);
    }
  };

  const handleToggleSaveAttempt = (attemptNum: number) => {
    setCompletedAttempts((prev) =>
      prev.includes(attemptNum)
        ? prev.filter((n) => n !== attemptNum)
        : [...prev, attemptNum]
    );
  };

  const handleResetSaveAttempts = () => {
    setCompletedAttempts([]);
  };

  const activeTraineeLogs = activeTrainee
    ? callLogs.filter((l) => l.traineeName.toLowerCase() === activeTrainee.toLowerCase())
    : [];
  const activeTotal = activeTraineeLogs.length;
  const activePassed = activeTraineeLogs.filter((l) => l.passed).length;

  return (
    <div className="min-h-screen bg-[#F9EDF0] text-[#261311] flex flex-col font-sans">
      {/* Top Application Header */}
      <header className="bg-[#1C3934] text-[#F9EDF0] border-b-2 border-[#C3955B] sticky top-0 z-30 shadow-md">
        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-[#BA6A36] text-[#F9EDF0] flex items-center justify-center font-black shadow-sm">
              <Headphones className="w-5 h-5" />
            </div>
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-lg sm:text-xl font-extrabold tracking-tight">
                  VoiceLab Call Companion
                </h1>
                <span className="text-[10px] bg-[#C3955B] text-[#261311] font-extrabold uppercase px-2 py-0.5 rounded">
                  One-Pager
                </span>
                <span className="text-[10px] bg-emerald-800 text-emerald-200 border border-emerald-600 font-semibold px-2 py-0.5 rounded flex items-center gap-1">
                  <Cloud className="w-3 h-3 text-emerald-300" />
                  Cloud Synced
                </span>
              </div>
              <p className="text-xs text-[#E6C8B7]">
                Live spoken scripts, objection spiels, save-attempt tracker & shared coaching log
              </p>
            </div>
          </div>

          <div className="flex items-center gap-2 self-start sm:self-auto">
            <button
              type="button"
              onClick={handleManualRefresh}
              className="text-xs bg-[#261311]/60 hover:bg-[#261311] text-[#E6C8B7] hover:text-white px-2.5 py-1.5 rounded-lg border border-[#C3955B]/40 flex items-center gap-1.5 cursor-pointer transition-colors"
              title="Verify cloud connection"
            >
              <RefreshCw className={`w-3.5 h-3.5 ${isSyncing ? 'animate-spin text-amber-300' : ''}`} />
              <span className="hidden sm:inline">{isSyncing ? 'Syncing...' : 'Sync Now'}</span>
            </button>

            {activeTrainee && (
              <div className="flex items-center gap-2 bg-[#261311]/70 px-3 py-1.5 rounded-lg border border-[#C3955B]/40 text-xs text-[#F9EDF0]">
                <span className="text-[#E6C8B7]">Active Trainee:</span>
                <span className="font-extrabold text-[#F9EDF0]">{activeTrainee}</span>
                <span className="text-[#C3955B]">|</span>
                <span className="font-bold text-emerald-300">
                  {activePassed} passed / {activeTotal} logged
                </span>
              </div>
            )}
          </div>
        </div>
      </header>

      {/* Main Single Page Layout */}
      <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
        {/* Live Multi-Device Cloud Sync Banner */}
        <div className="bg-emerald-950/40 border border-emerald-600/40 rounded-xl px-4 py-2.5 text-xs text-emerald-950 flex flex-wrap items-center justify-between gap-2 shadow-2xs">
          <div className="flex items-center gap-2">
            <span className="relative flex h-2.5 w-2.5">
              <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
            </span>
            <span className="font-extrabold text-[#1C3934] flex items-center gap-1">
              <Globe className="w-3.5 h-3.5 text-emerald-700" />
              Real-Time Cross-Device Sync Active:
            </span>
            <span className="text-[#261311]/85">
              Logs added from your <strong>phone</strong> or <strong>laptop</strong> show immediately on all screens with the link.
            </span>
          </div>
          <div className="flex items-center gap-2 text-[11px] text-[#261311]/70">
            <span className="inline-flex items-center gap-1 font-semibold text-emerald-900 bg-emerald-100/60 px-2 py-0.5 rounded">
              <CheckCircle2 className="w-3 h-3 text-emerald-600" />
              {isCloudConnected ? 'Cloud Online' : 'Local Cached'}
            </span>
            <span>
              {callLogs.length} total call{callLogs.length === 1 ? '' : 's'} · {lastSyncedTime ? `Updated ${lastSyncedTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}` : 'Ready'}
            </span>
          </div>
        </div>

        {/* Lead Source Selector Bar */}
        <div className="bg-[#1C3934] text-[#F9EDF0] p-3.5 rounded-xl border border-[#C3955B]/30 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div className="flex items-center gap-2">
            <span className="text-xs uppercase tracking-wider text-[#E6C8B7] font-bold">
              Choose Lead Source:
            </span>
            <div className="inline-flex rounded-lg p-1 bg-[#261311]/60 border border-[#C3955B]/40">
              {(['Thumbtack', 'Angi', 'Bark'] as LeadSource[]).map((src) => {
                const isSelected = src === leadSource;
                return (
                  <button
                    key={src}
                    type="button"
                    onClick={() => {
                      setLeadSource(src);
                      setCompletedAttempts([]);
                    }}
                    className={`px-3 py-1 text-xs font-bold rounded-md transition-all cursor-pointer ${
                      isSelected
                        ? 'bg-[#BA6A36] text-white shadow-xs'
                        : 'text-[#E6C8B7] hover:text-white hover:bg-[#1C3934]'
                    }`}
                  >
                    {src}
                  </button>
                );
              })}
            </div>
          </div>

          <div className="text-xs text-[#E6C8B7]/90 italic font-medium">
            {leadSource === 'Bark' && 'Bark rule: Confirm own home & ask ZIP code early. 3 save attempts required.'}
            {leadSource === 'Angi' && 'Angi rule: At least 1 genuine save attempt required before callback.'}
            {leadSource === 'Thumbtack' && 'Thumbtack rule: 3 or more genuine save attempts required before callback.'}
          </div>
        </div>

        {/* 1. Simple Save Attempt Tracker Tabs */}
        <section aria-label="Lead Save Attempt Tracker">
          <SaveAttemptTracker
            leadSource={leadSource}
            completedAttempts={completedAttempts}
            onToggleAttempt={handleToggleSaveAttempt}
            onResetAttempts={handleResetSaveAttempts}
          />
        </section>

        {/* 2. Step-by-Step Guided Call Flow from Beginning to End */}
        <section aria-label="Guided Call Flow">
          <GuidedCallFlow
            leadSource={leadSource}
            selectedHours={hours}
            onChangeHours={setHours}
            selectedMf={mf}
            onChangeMf={setMf}
            selectedMct={mct}
            onChangeMct={setMct}
            selectedFrequency={frequency}
            onChangeFrequency={setFrequency}
          />
        </section>

        {/* 3. Customer Response Helper (What did the customer just say?) */}
        <section aria-label="Customer Response Helper">
          <CustomerResponseHelper
            leadSource={leadSource}
            hours={hours}
            mf={mf}
            mct={mct}
            frequency={frequency}
            onRecordSaveAttempt={(_reason) => {
              setCompletedAttempts((prev) => {
                const nextAttempt = [1, 2, 3].find((n) => !prev.includes(n));
                return nextAttempt ? [...prev, nextAttempt] : prev;
              });
            }}
          />
        </section>

        {/* 4. Trainee Performance Dashboard (Shared across all devices) */}
        <section aria-label="Trainee Performance Dashboard">
          <SimpleDashboard
            logs={callLogs}
            onAddLog={handleAddLog}
            onDeleteLog={handleDeleteLog}
            onDeleteTrainee={handleDeleteTrainee}
            onClearAllLogs={handleClearAllLogs}
            activeTrainee={activeTrainee}
            onSelectTrainee={(name) => setActiveTrainee(name)}
            currentLeadSource={leadSource}
            isSyncing={isSyncing}
          />
        </section>
      </main>

      {/* App Footer */}
      <footer className="bg-[#1C3934] text-[#E6C8B7] text-xs py-4 border-t border-[#C3955B]/30 mt-auto">
        <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-left">
          <div>
            <span className="font-bold text-[#F9EDF0]">VoiceLab Call Companion</span> — Live collaborative dashboard for Homeaglow trainers & trainees.
          </div>
          <div className="text-[11px] text-[#E6C8B7]/70">
            Real-time cloud sync powered by Google Firebase Firestore. 75%+ score represents a passing call.
          </div>
        </div>
      </footer>
    </div>
  );
}

</script>

  try {

    var pre = 'const { useState, useEffect, useMemo, useRef, useCallback } = React;\n';
    var res = Babel.transform(pre + src + '\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));', {
      filename: 'app.tsx',
      presets: [['typescript', { isTSX: true, allExtensions: true }], 'react']
    });
    (0, eval)(res.code);
  } catch (e) {

    document.getElementById('root').innerHTML = '<div style="padding:2rem;font-family:system-ui;color:#991b1b">Failed to start: ' + String(e && e.message || e) + '</div>';

</body>
