<script type="text/plain" id="app-src">
const AlertCircle = makeIcon('AlertCircle');

// ===== types.ts =====
type LeadSource = 'Thumbtack' | 'Angi' | 'Bark';

interface CallStage {
  id: number;
  key: string;
  name: string;
  summary: string;
  goal: string;
  soundLike: string[];
  watchOuts: string[];
  selfCheck: string;
  sourceSpecificCues?: Record<LeadSource, string>;
  mandatoryWording?: string;
  quickChecklist: string[];
}

interface ObjectionBranch {
  id: number;
  triggerPhrases: string[];
  keywords: string[];
  concernTitle: string;
  category: 'price' | 'commitment' | 'uncertainty' | 'competitors' | 'trust' | 'operations' | 'boundary' | 'general' | 'faq' | 'value';
  acknowledge: string;
  clarifyingQuestion: string;
  verifiedResponse: string;
  nextStep: string;
  pairedValueStatement?: string; // Recommended follow-up value statement so trainee never repeats spiels
  relatedFaq?: string;
  isFirmNo?: boolean;
  safePolicyNote?: string;
  deliveryCue?: string;
}

interface ValueStatement {
  id: string;
  title: string;
  spiels: string[];
  deliveryCue: string;
}

interface FAQItem {
  id: string;
  question: string;
  answer: string;
  checkQuestion?: string;
  prohibitedAction?: string;
  category: 'policy' | 'pricing' | 'service' | 'booking';
}

interface DiscoveryLevel {
  level: number;
  title: string;
  goal: string;
  questions: string[];
}

interface SaveAttempt {
  id: string;
  leadSource: LeadSource;
  attemptNumber: number;
  angleUsed: string;
  timestamp: number;
}

interface CallLog {
  id: string;
  traineeName: string;
  timestamp: number;
  leadSource: LeadSource;
  score: number; // 0 - 100
  passed: boolean; // score >= 75
  highlight?: string; // What went well
  opportunity?: string; // What will I try next time / mistake to fix
  skillFocus?: string;
}

interface CallReflection {
  id: string;
  timestamp: number;
  leadSource: LeadSource;
  highlight: string;
  opportunity: string;
  score?: number;
  skillFocus?: string;
  saveAttemptsCount?: number;
}

interface TraineePerformance {
  traineeName: string;
  totalCalls: number;
  passedCalls: number;
  passRate: number; // percentage (0 - 100)
  lastCallTime: number;
  highlights: string[];
  opportunities: string[];
}

// ===== callFlowSpiels.ts =====


interface CallFlowStep {
  stepNumber: number;
  stepName: string;
  stageCategory: 'Opening' | 'Reason' | 'Qualify' | 'Discovery' | 'Playback' | 'Offer' | 'Terms' | 'Negotiate' | 'Close' | 'Booking' | 'Recap' | 'Upsell' | 'CleanClose';
  goal: string;
  sayThis: string;
  waitNotice?: string; // Visual cue reminding trainee to pause and wait for customer response
  followUpSayThis?: string; // Next single sentence after customer confirms
  deliveryCue: string;
  commonMistakes: string[];
  ifCustomerSays: { situation: string; action: string }[];
  isMandatoryWordForWord?: boolean;
}

const GET_LEAD_CALL_FLOW = (source: LeadSource, hours = 3): CallFlowStep[] => {
  const isBark = source === 'Bark';
  const isAngi = source === 'Angi';
  const isThumbtack = source === 'Thumbtack';

  // Math calculated directly from NLS guide
  const initialPrice = hours === 2 ? 19 : hours === 3 ? 19 : hours === 4 ? 38 : 78;
  const subsequentRate = hours === 2 ? 46 : hours === 3 ? 69 : hours === 4 ? 92 : 138;
  const etfFee = hours * 35;
  const nationalAvg = hours * 75;

  if (isBark) {
    return [
      {
        stepNumber: 1,
        stepName: '1. Opening & Recorded Notice',
        stageCategory: 'Opening',
        goal: 'Introduce as Homeaglow clearly, state recorded line within first 10 seconds, and confirm customer.',
        sayThis: '“Hi, this is (Your Name) with Homeaglow. I saw your cleaning request on Bark. Just so you know, I\'m calling on a recorded line. Am I speaking with (Customer Name)?”',
        waitNotice: 'Stop speaking and wait for the customer to confirm their name.',
        followUpSayThis: '“So you\'re not waiting on a quote, I\'ll give you ours in a minute. First I just want to check a couple of quick things to make sure we\'re a good fit. Is that okay?”',
        deliveryCue: 'Calm and unhurried from the first word. You want to sound like the easiest call they\'ve had today. Saying you\'ll give the price soon lowers their guard.',
        commonMistakes: [
          'Sounding like part of Bark or claiming to be local.',
          'Skipping or paraphrasing the recording notice.',
          'Rushing into the pitch before confirming the customer.'
        ],
        ifCustomerSays: [
          { situation: 'Customer says: “Just give me the price.”', action: 'Give it briefly: “Sure. Your first clean would be 3 hours for $19, plus applicable taxes, as the first month of our membership. I\'ll go through the rest once I know it fits.” Then qualify.' },
          { situation: 'Customer says they\'ve had a lot of calls:', action: 'Acknowledge it: “I bet. I\'ll be quick, and if we\'re not right for you I\'ll say so.”' },
          { situation: 'Customer asks you to stop calling:', action: '“Understood. I\'ll take your number off our call list now, and we won\'t call about this request again.” Follow DNC steps immediately.' }
        ]
      },
      {
        stepNumber: 2,
        stepName: '2. Qualify (Own Home & ZIP Code)',
        stageCategory: 'Qualify',
        goal: 'Confirm the home is for the customer and verify ZIP code in service area early (Bark rule).',
        sayThis: '“First, where is the cleaning for? Is it your home, or somewhere else, like a family member\'s place or a business?”',
        waitNotice: 'Wait for their answer. (If for a family member or gift, that is fine too: get the ZIP code).',
        followUpSayThis: '“Okay, good. What\'s the ZIP code there, just so I can check we have cleaners in that area?”',
        deliveryCue: 'Neutral and kind. A release should sound like a favor to them, not a rejection.',
        commonMistakes: [
          'Turning someone away because someone else is paying or it\'s a gift.',
          'Qualifying only after giving the price and terms.',
          'Failing to verify ZIP code early on Bark.'
        ],
        ifCustomerSays: [
          { situation: 'ZIP is outside our service area:', action: 'Release politely: “Thanks for checking. We don\'t have cleaners in that area right now, so I won\'t waste your time. Good luck with your search.”' },
          { situation: 'Another cleaning company collecting prices:', action: 'Release with the last line. No pitch, no terms.' }
        ]
      },
      {
        stepNumber: 3,
        stepName: '3. Discovery: Bathrooms & Goals (One Question at a Time)',
        stageCategory: 'Discovery',
        goal: 'Ask only what is missing, ONE QUESTION AT A TIME, with real pauses. Never stack questions.',
        sayThis: '“Great. The form didn\'t have everything, so I\'ll fill in a couple of gaps. How many bathrooms does the home have?”',
        waitNotice: 'Wait for their bathroom count. Do NOT ask another question in the same turn!',
        followUpSayThis: '“And in your own words, what are you hoping to get done with this cleaning?”',
        deliveryCue: 'Unhurried and curious. Short questions, real pauses. Bark forms often miss bathrooms or ZIP. Ask only what\'s missing.',
        commonMistakes: [
          'Stacking two questions in one turn (e.g. asking bathrooms and bedrooms together).',
          'Asking for the ZIP or bathrooms a second time.',
          'Moving on without actually listening to what they want.'
        ],
        ifCustomerSays: [
          { situation: 'Customer says it\'s a one-off before an event:', action: 'Play it back (“so this is a one-off deep clean before your parents visit”) and be ready to mention the one-time option honestly.' },
          { situation: 'Customer asks for a cleaner of a particular nationality:', action: 'Do not match on background: “I can\'t match on a cleaner\'s background, but I can make sure your cleaner is comfortable with pets in your home and note any preferred cleaning products or priority areas.”' }
        ]
      },
      {
        stepNumber: 4,
        stepName: '4. Motivation Playback',
        stageCategory: 'Playback',
        goal: 'Reflect the customer’s stated goal in their own words before mentioning pricing.',
        sayThis: `“So this is mainly (their goal) for your (home details), and you think it needs about ${hours} hours. Have I got that right?”`,
        waitNotice: 'Wait for the customer to confirm: “Yes, exactly.”',
        deliveryCue: 'Reflecting their need back in their own words proves you listened and builds deep trust before quoting numbers.',
        commonMistakes: [
          'Skipping playback and jumping straight into the membership pitch.',
          'Misstating their priority rooms or requested frequency.'
        ],
        ifCustomerSays: [
          { situation: 'Customer clarifies or adds a detail:', action: 'Acknowledge it: “Got it, I’ll make sure that’s prioritized.”' }
        ]
      },
      {
        stepNumber: 5,
        stepName: `5. The Offer: First Clean ($${initialPrice} Today)`,
        stageCategory: 'Offer',
        goal: `State the value of a ${hours}-hour clean, quote the $19 introductory first clean, and name the membership in the same breath.`,
        sayThis: hours === 4
          ? `“Thanks for walking me through your place. For a home your size, I'd plan on about 4 hours for the first clean. At the national average, a 4-hour clean runs around $300. With our membership, a 4-hour clean after the first one is about $92, plus applicable taxes. For your first visit, you'd pay $38 today, plus applicable taxes. $19 is your first month of membership, which includes 3 hours, and $19, plus applicable taxes, covers the extra 1 hour your home needs. How does that sound?”`
          : hours === 6
          ? `“Thanks for walking me through your place. For a home your size, I'd plan on about 6 hours for the first clean. At the national average, a 6-hour clean runs around $450. With our membership, a 6-hour clean after the first one is about $138, plus applicable taxes. For your first visit, you'd pay $78 today, plus applicable taxes. $19 is your first month of membership, which includes 3 hours, and $59, plus applicable taxes, covers the extra 3 hours your home needs. How does that sound?”`
          : `“Thanks for walking me through your place. For a home your size, I'd plan on about ${hours} hours for the first clean. At the national average, a ${hours}-hour clean runs around $${nationalAvg}. With our membership, a ${hours}-hour clean after the first one is about $${subsequentRate}, plus applicable taxes. For your first visit, you'd pay $19 today, plus applicable taxes. That $19, plus applicable taxes, is your first month of membership, and the ${hours} hours of cleaning are included in it. How does that sound?”`,
        waitNotice: 'Wait for customer reaction. If they ask questions, answer simply and proceed to Terms.',
        deliveryCue: 'Give our price plainly, sized to their own hour estimate, with the membership named in the same breath so $19 is never a surprise.',
        commonMistakes: [
          'Saying the clean is "free" without mentioning the $19 covers the first month of membership.',
          'Quoting the price before completing discovery.'
        ],
        ifCustomerSays: [
          { situation: 'Customer says: “That sounds great”:', action: 'Move directly to Part 2: Terms and Commitment.' },
          { situation: 'Customer says: “I only wanted one clean”:', action: 'Offer one-time clean: “Sure, we can do a one-time clean. For 3 hours, that\'s $150, plus applicable taxes. Does that work for what you need?”' }
        ]
      },
      {
        stepNumber: 6,
        stepName: '6. The Terms: $59/mo, ~$23/hr, 6 Months & ETF',
        stageCategory: 'Terms',
        goal: 'Explain the $59/mo ongoing membership, ~$23/hr rate, 6 paid months commitment, and $35/hr ETF clearly.',
        sayThis: '“Here\'s how it works. After the first month, the membership is $59 a month, plus applicable taxes, billed on the same date each month until you cancel. That\'s what keeps your cleanings at about $23 an hour, plus applicable taxes, and that already includes a 15% transaction fee. Does that make sense so far?”',
        waitNotice: 'Wait for them to say yes, then state the commitment and cancellation fee clearly:',
        followUpSayThis: `“The plan is 6 paid months. You can cancel any time, but if you cancel before 6 paid months, there's an early cancellation fee of $35, plus applicable taxes, for each hour of your first clean. For you that's $${etfFee}, plus applicable taxes. Are you okay with that?”`,
        deliveryCue: 'Give the full picture: $59/mo, ~$23/hr, 6 paid months, and exact ETF dollar amount. Get a clear yes before taking any card details.',
        commonMistakes: [
          'Hiding or glossing over the early cancellation fee.',
          'Not waiting for a clear "yes" before attempting to close.'
        ],
        ifCustomerSays: [
          { situation: 'Customer hesitates on monthly cost ($59):', action: 'Concession: “I hear you on the monthly cost. I can bring the membership down to $54 a month, plus applicable taxes. Would that work for you?” (If still too much: $49 floor).' },
          { situation: 'Customer objects to 6 months:', action: 'Concession: “I understand six months feels like a lot. I can make it 4 paid months instead. If you cancel before then, the early cancellation fee is still $35 for each hour of your first clean, plus applicable taxes. Would that work for you?”' }
        ]
      },
      {
        stepNumber: 7,
        stepName: '7. Close: Choice of Two Dates (3+ Days Out)',
        stageCategory: 'Close',
        goal: 'Ask for the booking with a choice of two options, 3 or more days out. Never ask a yes/no.',
        sayThis: '“Great, thanks. When would you like your first clean, Tuesday morning or Wednesday afternoon?”',
        waitNotice: 'Silence is essential here. Let the silence sit until the customer picks a day.',
        deliveryCue: 'Calm and low-key. Relaxed and assumptive, but not pushy. The low pressure is the point; let silence sit.',
        commonMistakes: [
          'Asking a yes/no question like "Do you want to book?" instead of offering a choice of two.',
          'Using high-pressure urgency.',
          'Accepting "I need to think about it" without attempting a save.'
        ],
        ifCustomerSays: [
          { situation: 'Customer picks a day/time:', action: 'Move immediately to Step 8 (Booking).' },
          { situation: 'Customer says: “I’m still looking / need to think”:', action: 'Ask what’s open: “That makes sense. What would you want to see before deciding?” (Log save attempt).' }
        ]
      },
      {
        stepNumber: 8,
        stepName: '8. Booking & Card Hold Disclosure (Mandatory Word-For-Word)',
        stageCategory: 'Booking',
        goal: 'Confirm appointment, read the mandatory $75 card hold disclosure on recording, and collect payment method.',
        isMandatoryWordForWord: true,
        sayThis: `“Okay, (day) at (time) for your home in (ZIP). For the $${initialPrice}, plus applicable taxes, I can take your card over the phone, or text you a secure payment link from Homeaglow. Which is easier?”`,
        waitNotice: 'Wait for them to choose phone or link, then read the card hold disclosure word-for-word on the recorded line:',
        followUpSayThis: '“One quick thing so nothing surprises you on your statement. Before your first cleaning, we may place a temporary hold of up to $75 on your card to confirm it\'s valid. It\'s not a charge. After your cleaning, we only take what\'s actually owed for that visit, like any extra hours you add, and the rest of the hold is released. Your first cleaning is still free. You may see it as pending on your bank shortly after booking.”',
        deliveryCue: 'MANDATORY WORD FOR WORD: Read the Card Hold Disclosure while the call is still being recorded, before you pause the recording for card details.',
        commonMistakes: [
          'Reading back the card security code (CVV) on a recorded line.',
          'Skipping or summarizing the Card Hold Disclosure.',
          'Not telling the customer where the payment link arrives from.'
        ],
        ifCustomerSays: [
          { situation: 'Customer prefers payment link:', action: '“It\'ll arrive by text from Homeaglow in a moment. I\'ll stay on the line while you open it.”' },
          { situation: 'Customer wants sooner date (today/tomorrow):', action: 'Recommend 3 days in advance first; if declined, offer 2 days; if still declined, offer best-effort urgent request.' }
        ]
      },
      {
        stepNumber: 9,
        stepName: '9. Full Recap',
        stageCategory: 'Recap',
        goal: 'Read back all agreed terms one part at a time, wait for yes after each.',
        sayThis: `“Let me read that back. A ${hours}-hour clean for your place on (day) at (time). You've paid $${initialPrice}, plus applicable taxes, then it's $59 a month from next month, plus applicable taxes, with cleanings at about $23 an hour. It's 6 paid months, with the early cancellation fee of $${etfFee} we went over. Did I get all of that right?”`,
        waitNotice: 'Wait for customer confirmation. If they correct a detail, thank them, fix it, and read that part back.',
        deliveryCue: 'Steady and clear. Leave room for corrections. Never rush the recap.',
        commonMistakes: [
          'Recapping the date without the price terms.',
          'Rushing so the customer can’t correct anything.'
        ],
        ifCustomerSays: [
          { situation: 'Customer corrects something:', action: 'Thank them, fix it, and read back just that part.' },
          { situation: 'Customer seems unsure about a term:', action: 'Go back over it slowly before moving on.' }
        ]
      },
      {
        stepNumber: 10,
        stepName: '10. Premium Cleaner Program Upsell (+0.2 QA, Word-For-Word)',
        stageCategory: 'Upsell',
        goal: 'Read the approved Premium Cleaner Program wording exactly right after resuming recording (+0.2 QA bonus). Accept either answer.',
        isMandatoryWordForWord: true,
        sayThis: '“Before I let you go, there\'s one optional add-on I mention to everyone. It\'ll only take a moment. Most of our cleaners are great, but in busy areas the very best ones are in high demand, so there\'s a lot of competition for them. Would you like to be in our Premium Cleaner Program? It makes sure you have access to our top cleaners and puts your cleanings on their radar first. It\'s $20 per cleaning, plus applicable taxes, and you won\'t be charged if your cleaner is under 4.5 stars.”',
        waitNotice: 'Wait for their answer. A clear verbal YES is required. Silence, "I guess" or "sure" is not a clear YES; re-ask once.',
        followUpSayThis: '“Just to confirm, I\'m adding Premium Cleaner to your account. That\'s $20 per cleaning, plus applicable taxes, and it only applies to cleanings completed by a Premium Cleaner. If a Premium Cleaner isn\'t assigned, there\'s no charge for that appointment. Is that okay with you?”',
        deliveryCue: 'Light and easy. Optional should sound optional. Read word for word. (+0.2 QA if offered, -0.2 QA penalty if omitted).',
        commonMistakes: [
          'Skipping the upsell (-0.2 QA penalty).',
          'Paraphrasing the approved wording.',
          'Pushing after a no.'
        ],
        ifCustomerSays: [
          { situation: 'Customer says no / declines:', action: '“No problem at all.” Move immediately to Clean Close.' },
          { situation: 'Customer asks about price:', action: 'Answer only from approved wording: “It\'s $20 per cleaning, plus applicable taxes, and only applies if a 4.5+ star cleaner completes the clean.”' }
        ]
      },
      {
        stepNumber: 11,
        stepName: '11. Clean Close',
        stageCategory: 'CleanClose',
        goal: 'Thank the customer, confirm email confirmation from Homeaglow, and end warmly.',
        sayThis: '“You\'re all set, (Customer Name). You\'ll get a confirmation from Homeaglow by email. If anything changes, you can reschedule from your online dashboard. Thanks for taking my call today!”',
        deliveryCue: 'Warm and brief. End with the next step and nothing more. No extra selling after the sale is made.',
        commonMistakes: [
          'Ending abruptly without thanking them.',
          'Leaving next steps or confirmation email delivery vague.'
        ],
        ifCustomerSays: [
          { situation: 'If sale made:', action: 'Use the clean close line above.' },
          { situation: 'If scheduling callback instead:', action: '“Okay, so I\'ll call you on (day) at (time) from this number. Thanks for your time, (Customer Name), and good luck with the rest of your quotes!”' }
        ]
      }
    ];
  }

  if (isAngi) {
    return [
      {
        stepNumber: 1,
        stepName: '1. Opening & Recorded Notice',
        stageCategory: 'Opening',
        goal: 'Identify as Homeaglow calling back about Angi request, state recorded line clearly, and confirm customer.',
        sayThis: '“Hi, this is (Your Name) with Homeaglow, calling about the cleaning request you placed on Angi. Just so you know, I\'m calling on a recorded line. Am I speaking with (Customer Name)?”',
        waitNotice: 'Pause and wait for the customer to confirm their name.',
        deliveryCue: 'Steady and clear, at a normal pace. Sound like a business calling back, not a promotion.',
        commonMistakes: [
          'Introducing yourself as if calling from Angi.',
          'Skipping the recording notice (Angi does not play one automatically).',
          'Starting the offer before confirming you have the right person.'
        ],
        ifCustomerSays: [
          { situation: 'Customer sounds annoyed by several providers calling:', action: 'Acknowledge it before going on: “I\'m sure you\'ve had a few calls. I\'ll be quick and straight with you.”' },
          { situation: 'Customer asks you to stop calling:', action: '“Understood. I\'ll take your number off our call list now, and we won\'t call about this request again.” Follow DNC rules.' }
        ]
      },
      {
        stepNumber: 2,
        stepName: '2. Reason for the Call',
        stageCategory: 'Reason',
        goal: 'Explain the call purpose calmly and set clear expectations.',
        sayThis: '“I saw you\'re looking for cleaning for your (home details). I\'d like to understand what you need, answer any questions, and give you clear numbers.”',
        waitNotice: 'Pause and let them acknowledge before diving into questions.',
        deliveryCue: 'Calm and practical. If they are stressed about timing, slow down and sound like you are handling it.',
        commonMistakes: [
          'Promising a same-day or next-day clean without verifying.',
          'Ignoring an urgency comment and rushing straight into the pitch.'
        ],
        ifCustomerSays: [
          { situation: 'Customer needs it today or tomorrow:', action: 'Acknowledge urgency, but make the 3-day recommendation first before escalating.' }
        ]
      },
      {
        stepNumber: 3,
        stepName: '3. Discovery: Frequency & Competing Quotes',
        stageCategory: 'Discovery',
        goal: 'Ask desired frequency and hear their competing quotes ONE QUESTION AT A TIME.',
        sayThis: '“So I can give you numbers that actually fit, how often were you hoping to have cleaning done?”',

        <div className="flex items-center gap-1.5 bg-[#261311]/60 p-1.5 rounded-lg border border-[#C3955B]/40 self-start sm:self-auto">
          <span className="text-[10px] uppercase font-bold text-[#E6C8B7] px-1.5">First Clean Hours:</span>
          {[2, 3, 4, 6].map((hrs) => (
            <button
              key={hrs}
              type="button"
              onClick={() => setSelectedHours(hrs)}
              className={`px-2.5 py-1 text-xs font-bold rounded cursor-pointer transition-all ${
                selectedHours === hrs
                  ? 'bg-[#BA6A36] text-white shadow-xs'
                  : 'text-[#E6C8B7] hover:text-white hover:bg-[#1C3934]'
              }`}
            >
              {hrs}h
            </button>
          ))}
        </div>
      </div>

      {/* Step Navigation Bar */}
      <div className="px-4 overflow-x-auto">
        <div className="flex items-center gap-1 min-w-max pb-2">
          {steps.map((st, idx) => {
            const isCurrent = idx === currentStepIndex;
            const isCompleted = idx < currentStepIndex;

            return (
              <button
                key={st.stepNumber}
                type="button"
                onClick={() => setCurrentStepIndex(idx)}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5 ${
                  isCurrent
                    ? 'bg-[#BA6A36] text-white shadow-sm ring-2 ring-[#E6C8B7]'
                    : isCompleted
                    ? 'bg-[#E6C8B7]/40 text-[#1C3934] hover:bg-[#E6C8B7]/70'
                    : 'bg-[#F9EDF0] text-[#261311]/60 hover:bg-[#E6C8B7]/30'
                }`}
              >
                <span>{st.stepName}</span>
                {isCompleted && <CheckCircle2 className="w-3.5 h-3.5 text-emerald-800" />}
              </button>
            );
          })}
        </div>
      </div>

      {/* Active Step Content */}
      <div className="p-4 sm:p-5 pt-1 space-y-4">
        {/* Step Header */}
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-[#E6C8B7] pb-3">
          <div>
            <div className="flex items-center gap-2">
              <span className="text-xs font-extrabold text-[#BA6A36] uppercase tracking-wider">
                Step {activeStep.stepNumber} of {steps.length}
              </span>
              <span className="text-[10px] bg-[#1C3934] text-[#F9EDF0] px-2 py-0.5 rounded font-bold uppercase">
                {activeStep.stageCategory}
              </span>
            </div>
            <h3 className="text-base sm:text-lg font-black text-[#1C3934] mt-0.5">
              {activeStep.stepName}
            </h3>
            <p className="text-xs text-[#261311]/80 mt-0.5 font-medium">
              Goal: {activeStep.goal}
            </p>
          </div>

          {activeStep.isMandatoryWordForWord && (
            <span className="text-[10px] bg-amber-100 text-amber-900 border border-amber-300 font-extrabold uppercase px-2.5 py-1 rounded-full flex items-center gap-1 self-start sm:self-auto">
              <ShieldAlert className="w-3.5 h-3.5 text-amber-700" />
              Mandatory Word-For-Word on Recording
            </span>
          )}
        </div>

        {/* Turn 1: Say this (Spoken Script) */}
        <div className="space-y-1.5">
          <div className="flex items-center justify-between">
            <span className="text-xs font-black uppercase text-[#BA6A36] flex items-center gap-1.5">
              <Volume2 className="w-4 h-4 text-[#BA6A36]" />
              Say this (Spoken Script):
            </span>
            <button
              type="button"
              onClick={() => handleCopy(activeStep.sayThis, 'main-spiel')}
              className="text-xs text-[#BA6A36] font-bold flex items-center gap-1 cursor-pointer bg-[#F9EDF0] px-2 py-0.5 rounded border border-[#E6C8B7]"
            >
              {copiedKey === 'main-spiel' ? (
                <>
                  <Check className="w-3.5 h-3.5 text-emerald-600" />
                  <span className="text-emerald-700">Copied</span>
                </>
              ) : (
                <>
                  <Copy className="w-3.5 h-3.5" />
                  <span>Copy Spiel</span>
                </>
              )}
            </button>
          </div>

          <div className="bg-[#F9EDF0] p-4 rounded-xl border-2 border-[#E6C8B7] text-sm sm:text-base text-[#1C3934] font-bold leading-relaxed shadow-xs">
            {activeStep.sayThis}
          </div>
        </div>

        {/* Wait Pause Notice (Prevents Question Stacking) */}
        {activeStep.waitNotice && (
          <div className="bg-amber-50 border-l-4 border-amber-500 p-2.5 rounded-r-lg text-xs text-amber-950 flex items-center gap-2">
            <PauseCircle className="w-4 h-4 text-amber-600 shrink-0" />
            <span className="font-extrabold">PAUSE & WAIT:</span>
            <span className="font-medium">{activeStep.waitNotice}</span>
          </div>
        )}

        {/* Turn 2: Follow-Up Say this (After Customer Confirms) */}
        {activeStep.followUpSayThis && (
          <div className="space-y-1.5 pt-1">
            <div className="flex items-center justify-between">
              <span className="text-xs font-black uppercase text-[#1C3934] flex items-center gap-1.5">
                <Sparkles className="w-4 h-4 text-[#1C3934]" />
                Then Say this (After Customer Confirms):
              </span>
              <button
                type="button"
                onClick={() => handleCopy(activeStep.followUpSayThis || '', 'followup-spiel')}
                className="text-xs text-[#1C3934] font-bold flex items-center gap-1 cursor-pointer bg-[#F9EDF0] px-2 py-0.5 rounded border border-[#E6C8B7]"
              >
                {copiedKey === 'followup-spiel' ? (
                  <>
                    <Check className="w-3.5 h-3.5 text-emerald-600" />
                    <span className="text-emerald-700">Copied</span>
                  </>
                ) : (
                  <>
                    <Copy className="w-3.5 h-3.5" />
                    <span>Copy</span>
                  </>
                )}
              </button>
            </div>

            <div className="bg-white p-3.5 rounded-xl border-2 border-[#1C3934] text-xs sm:text-sm text-[#1C3934] font-bold leading-relaxed shadow-xs">
              {activeStep.followUpSayThis}
            </div>
          </div>
        )}

        {/* Delivery Cue & Common Mistakes Grid */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
          {/* Delivery Cue */}
          <div className="bg-[#E6C8B7]/25 p-3 rounded-xl border border-[#C3955B]/40 text-xs text-[#261311] space-y-1">
            <div className="font-extrabold text-[#1C3934] uppercase tracking-wider text-[11px] flex items-center gap-1">
              <span>Delivery Cue (Vocal Tone):</span>
            </div>
            <p className="font-medium text-[#261311]/90 leading-relaxed">
              {activeStep.deliveryCue}
            </p>
          </div>

          {/* Common Mistakes to Avoid */}
          <div className="bg-red-50/60 p-3 rounded-xl border border-red-200 text-xs text-red-950 space-y-1">
            <div className="font-extrabold text-red-900 uppercase tracking-wider text-[11px] flex items-center gap-1">
              <AlertTriangle className="w-3 h-3 text-red-600" />
              <span>VoiceLab Fatal Traps to Avoid:</span>
            </div>
            <ul className="space-y-0.5 pl-4 list-disc text-red-900 font-medium">
              {activeStep.commonMistakes.map((mistake, mIdx) => (
                <li key={mIdx}>{mistake}</li>
              ))}
            </ul>
          </div>
        </div>

        {/* If customer says X, do Y */}
        {activeStep.ifCustomerSays.length > 0 && (
          <div className="bg-[#F9EDF0]/60 p-3 rounded-xl border border-[#E6C8B7] space-y-2">
            <div className="text-[11px] font-black text-[#1C3934] uppercase tracking-wider flex items-center gap-1">
              <HelpCircle className="w-3.5 h-3.5 text-[#BA6A36]" />
              If the customer says X, do Y (Simulator Branching):
            </div>
            <div className="space-y-1.5">
              {activeStep.ifCustomerSays.map((branch, bIdx) => (
                <div
                  key={bIdx}
                  className="bg-white p-2 rounded-lg border border-[#E6C8B7] text-xs flex flex-col sm:flex-row sm:items-start justify-between gap-1 shadow-2xs"
                >
                  <span className="font-bold text-[#1C3934]">{branch.situation}</span>
                  <span className="text-[#261311]/90 font-medium pl-2 sm:pl-0 sm:max-w-md">
                    → {branch.action}
                  </span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Prev / Next navigation */}
        <div className="flex items-center justify-between pt-2 border-t border-[#E6C8B7]">
          <button
            type="button"
            disabled={currentStepIndex === 0}
            onClick={() => setCurrentStepIndex(Math.max(0, currentStepIndex - 1))}
            className="px-3.5 py-1.5 text-xs font-bold rounded-lg border border-[#C3955B] text-[#1C3934] disabled:opacity-30 disabled:cursor-not-allowed hover:bg-[#E6C8B7]/40 cursor-pointer"
          >
            ← Previous Step
          </button>
          <span className="text-[11px] text-[#261311]/60">
            Step {currentStepIndex + 1} of {steps.length} — Click pills above to jump
          </span>
          <button
            type="button"
            disabled={currentStepIndex === steps.length - 1}
            onClick={() => setCurrentStepIndex(Math.min(steps.length - 1, currentStepIndex + 1))}
            className="px-4 py-1.5 text-xs font-bold rounded-lg bg-[#1C3934] text-[#F9EDF0] disabled:opacity-30 disabled:cursor-not-allowed hover:bg-[#1C3934]/90 cursor-pointer flex items-center gap-1"
          >
            <span>Next Step</span>
            <ChevronRight className="w-3.5 h-3.5" />
          </button>
        </div>
      </div>
    </div>
  );
};

interface MatchResult {
  branch: ObjectionBranch;
  score: number;
  matchedKeywords: string[];
  confidence: 'high' | 'medium' | 'low';
  matchedReason?: string;
}

// Stop words that shouldn't inflate matching scores alone, but allow key negation/intent words
const STOP_WORDS = new Set([
  'a', 'about', 'above', 'after', 'again', 'against', 'all', 'am', 'an', 'and',
  'any', 'are', 'as', 'at', 'be', 'because', 'been', 'before', 'being', 'below',
  'between', 'both', 'by', 'could', 'did', 'do', 'does', 'doing', 'down', 'during',

  'her', 'here', 'hers', 'herself', 'him', 'himself', 'his', 'how', 'i', 'if',
  'in', 'into', 'is', 'it', 'its', 'itself', 'just', 'me', 'more', 'most', 'my',
  'myself', 'of', 'off', 'on', 'once', 'only', 'or', 'other', 'our', 'ours',
  'ourselves', 'out', 'over', 'own', 'same', 'she', 'should', 'so', 'some', 'such',
  'than', 'that', 'the', 'their', 'theirs', 'them', 'themselves', 'then', 'there',
  'these', 'they', 'this', 'those', 'through', 'to', 'too', 'under', 'until', 'up',
  'very', 'was', 'we', 'were', 'what', 'when', 'where', 'which', 'while', 'who',
  'whom', 'why', 'will', 'with', 'would', 'you', 'your', 'yours', 'yourself'
]);

function levenshteinDistance(s1: string, s2: string): number {
  if (s1 === s2) return 0;
  if (s1.length === 0) return s2.length;
  if (s2.length === 0) return s1.length;

  const matrix: number[][] = [];
  for (let i = 0; i <= s2.length; i++) {
    matrix[i] = [i];
  }
  for (let j = 0; j <= s1.length; j++) {
    matrix[0][j] = j;
  }

  for (let i = 1; i <= s2.length; i++) {
    for (let j = 1; j <= s1.length; j++) {
      if (s2.charAt(i - 1) === s1.charAt(j - 1)) {
        matrix[i][j] = matrix[i - 1][j - 1];
      } else {
        matrix[i][j] = Math.min(
          matrix[i - 1][j - 1] + 1,
          matrix[i][j - 1] + 1,
          matrix[i - 1][j] + 1
        );
      }
    }
  }

  return matrix[s2.length][s1.length];
}

function normalize(text: string): string {
  return text
    .toLowerCase()
    .replace(/[^\w\s$]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function matchCustomerUtterance(input: string): MatchResult[] {
  const rawInput = input.trim();
  if (!rawInput) return [];

  const normalized = normalize(rawInput);
  const inputWords = normalized.split(/\s+/).filter((w) => w.length > 0);
  const meaningfulWords = inputWords.filter((w) => !STOP_WORDS.has(w) || w === 'no' || w === 'not');

  const scoredMap = new Map<number, { score: number; keywords: string[]; reason: string }>();

  function addScore(branchId: number, points: number, keyword: string, reason?: string) {
    const existing = scoredMap.get(branchId) || { score: 0, keywords: [], reason: '' };
    existing.score += points;
    if (keyword && !existing.keywords.includes(keyword)) {
      existing.keywords.push(keyword);
    }
    if (reason && !existing.reason) {
      existing.reason = reason;
    }
    scoredMap.set(branchId, existing);
  }

  // ==========================================
  // 1. Broad Intent Detection Rules (Regex)
  // ==========================================

  // Firm No / Stop calling (Branch 21)
  if (/(stop calling|do not call|don't call|remove me|take me off|not interested|no thanks|never call|lose my number|unsubscribe|harass|leave me alone|please don't|stop texting|quit calling|\bno\b|\bnope\b)/i.test(normalized)) {
    addScore(21, 150, 'Firm No / Stop Contacting', 'Customer stated firm no or requested to stop calling');
  }

  // Busy or Driving / In a meeting (Branch 22)
  if (/(driving|in the car|behind the wheel|on the road|traffic|bad time|busy right now|in a meeting|at work|can't talk|cannot talk|call me later|call back later|call me back|call tomorrow|call next week|call later|give me a call later|reach me later)/i.test(normalized)) {
    addScore(22, 140, 'Busy / Driving / Callback Requested', 'Customer is driving or busy right now');
  }

  // Spouse / Partner / Decision-maker (Branch 16)
  if (/(husband|wife|partner|spouse|fiance|boyfriend|girlfriend|he pays|she pays|roommate|talk to my|check with my|consult my|ask my|other half|discuss with)/i.test(normalized)) {
    addScore(16, 130, 'Spouse / Partner Decision Maker', 'Customer needs to consult spouse or partner');
  }

  // Early Cancellation Fee / Math (Branch 3)
  if (/(cancel fee|cancellation fee|how much to cancel|what if i cancel|cost to cancel|cancel early|early termination|etf|penalty to cancel|charge to cancel)/i.test(normalized)) {
    addScore(3, 140, 'Cancellation Fee Math', 'Inquiring about exact cancellation fee ($35/hr)');
  }

  // 6-Month Commitment / Contract Hesitation (Branch 2)
  if (/(six month|6 month|commitment|contract|locked in|tied down|how long is the agreement|long contract|agree to 6 months|six-month|bind|binding|lock me in)/i.test(normalized)) {
    addScore(2, 130, '6-Month Commitment', 'Hesitation regarding 6-month membership length');
  }

  // Price / Expensive / Budget (Branch 1)
  if (/(expensive|costs? a lot|price feels high|too much|too high|money|budget|afford|costly|pricey|a bit steep|cheaper|rates?|high rate|charge too much|out of budget|don't have the funds)/i.test(normalized)) {
    addScore(1, 120, 'Price / Budget Concern', 'Customer feels the price or membership is high');
  }

  // Hidden fees / Transparency (Branch 14)
  if (/(hidden fee|hidden charge|surprise|extra fee|fine print|what's the catch|catch|scam|any extra|any hidden|sneaky)/i.test(normalized)) {
    addScore(14, 135, 'Hidden Fees / Transparency', 'Concern about surprise charges or fine print');
  }

  // $19 Extra Hour vs Ongoing Rate (Branch 15)
  if (/(19 extra|extra hour|additional hour|why 19 and 23|why 23|different rate|two different prices)/i.test(normalized)) {
    addScore(15, 130, '$19 Extra Hour vs Ongoing', 'Confusion over first-clean vs future clean rate');
  }

  // Already hired someone (Branch 23)
  if (/(already hired|hired someone|already found|found someone|already booked|booked someone|went with someone|another cleaner|hired another|found another)/i.test(normalized)) {
    addScore(23, 140, 'Already Hired Someone', 'Customer already hired or booked another cleaner');
  }

  // Cleaner nationality / background (Branch 24)
  if (/(nationality|where is the cleaner from|where are they from|spanish|english speaking|speak spanish|speak english|cleaner background|race of cleaner|origin|immigrant|hispanic|caucasian|black|asian|european)/i.test(normalized)) {
    addScore(24, 140, 'Cleaner Nationality / Background', 'Inquiring about cleaner nationality or background');
  }

  // Are you local? / Where are you based? (Branch 25)
  if (/(are you local|where are you based|where is your office|where are you located|are you guys local|local company|office near me)/i.test(normalized)) {
    addScore(25, 140, 'Are You Local / Location', 'Asking if company or cleaners are local');
  }

  // Part of Bark / Angi / Thumbtack or Real Company? (Branch 26)
  if (/(part of bark|part of angi|part of thumbtack|affiliated with|real company|who are you guys|are you legit|who is homeaglow)/i.test(normalized)) {
    addScore(26, 140, 'Real Company / Lead Platform Affiliation', 'Clarifying company identity vs lead platform');
  }

  // Bad reviews / Complaints (Branch 27)
  if (/(bad reviews|negative reviews|poor rating|complaints|terrible reviews|one star|saw bad reviews|read bad reviews)/i.test(normalized)) {
    addScore(27, 140, 'Negative Online Reviews', 'Customer referenced negative online reviews');
  }

  // Pay in cash (Branch 28)
  if (/(pay in cash|pay cash|cash to cleaner|cash on arrival|pay the cleaner directly|take cash|paper money)/i.test(normalized)) {
    addScore(28, 140, 'Cash Payment Request', 'Asking to pay cleaner with cash');
  }

  // Won't use service often / Every couple of months (Branch 29)
  if (/(every couple of months|couple of months|few times a year|not very often|occasionally|infrequent|every few months|once in a while)/i.test(normalized)) {
    addScore(29, 140, 'Infrequent Cleaning Need', 'Customer only needs cleaning every few months');
  }

  // Text me the details / In a rush (Branch 30)
  if (/(just text me|text me the details|send me a text|text the info|text the quote|send via text|don't have time to talk)/i.test(normalized)) {
    addScore(30, 140, 'Text Me Instead', 'Customer requested details sent by text message');
  }

  // Sounds like a scam / $19 for 3 hours (Branch 31)
  if (/(sounds like a scam|this is a scam|too good to be true|what's the catch|sounds fishy|gimmick|catch to 19)/i.test(normalized)) {
    addScore(31, 145, 'Sounds Like a Scam / Catch', 'Customer suspicious of low $19 introductory price');
  }

  // Too many calls today / Flooded (Branch 32)
  if (/(too many calls|so many calls|everyone is calling|flooded with calls|bombarded|fifth call|fourth call|tired of calls)/i.test(normalized)) {
    addScore(32, 140, 'Too Many Calls / Flooded', 'Customer overwhelmed by multiple company calls');
  }

  // Why a membership? / Just want a cleaner (Branch 33)
  if (/(why do i need a membership|why a membership|just want a cleaner|don't want a subscription|subscription|just need someone to clean)/i.test(normalized)) {
    addScore(33, 140, 'Distrust of Membership Model', 'Questions why membership is required instead of single hire');
  }

  // By my math that's 40-something an hour (Branch 34)
  if (/(by my math|forty something an hour|43 an hour|real hourly|more like 40|math doesn't add up|math works out)/i.test(normalized)) {
    addScore(34, 140, 'Their Own Hourly Math', 'Customer calculated all-in hourly rate including $59 fee');
  }

  // Is there a trial? / Try without signing up (Branch 35)
  if (/(is there a trial|try it without signing up|trial clean|sample clean|test run|try before contract|trial period)/i.test(normalized)) {
    addScore(35, 140, 'Trial Request', 'Customer asking for a trial clean without membership commitment');
  }

  // Don't give card over the phone (Branch 36)
  if (/(card over the phone|don't give my card|not giving card|not reading card|online payment link|scared to read card)/i.test(normalized)) {
    addScore(36, 140, 'Card Over the Phone Hesitation', 'Customer hesitant to read credit card numbers over phone');
  }

  // Cheaper competitor / Found someone else (Branch 17 & 7)
  if (/(cheaper cleaner|found someone cheaper|got a lower quote|someone else is cheaper|another cleaner is cheaper|less money somewhere else)/i.test(normalized)) {
    addScore(17, 135, 'Found Cheaper Cleaner', 'Customer received a cheaper competitor quote');
  } else if (/(comparing|shopping around|other quotes|looking around|other companies|other cleaners|talking to someone else|got other bids)/i.test(normalized)) {
    addScore(7, 125, 'Comparing Other Companies', 'Customer actively comparing multiple cleaning services');
  }

  // Supplies & Equipment / Vacuum / Products (Branch 10)
  if (/(supplies|vacuum|mop|cleaner bring|bring their own|products|detergent|bleach|chemicals|rags|broom|eco friendly|green clean)/i.test(normalized)) {
    addScore(10, 135, 'Cleaning Supplies & Equipment', 'Asking if cleaners bring vacuum and products');
  }

  // Same cleaner continuity (Branch 11)
  if (/(same cleaner|same person|consistent cleaner|regular cleaner|who comes|different cleaner every time|familiar face|same pro)/i.test(normalized)) {
    addScore(11, 135, 'Same Cleaner Continuity', 'Asking if the exact same cleaner comes every visit');
  }

  // Hardwood floors / Special surfaces (Branch 12)
  if (/(hardwood|wood floor|wood floors|parquet|marble|granite|delicate floor|tile|scratch|flooring)/i.test(normalized)) {
    addScore(12, 135, 'Hardwood & Special Flooring', 'Concerns about caring for hardwood or delicate floors');
  }

  // Pets & Shedding (Branch 13)
  if (/(dog|cat|dogs|cats|pet|pets|shed|shedding|hair|fur|animal|animals|bark|puppy|kitten)/i.test(normalized)) {
    addScore(13, 135, 'Pets & Pet Hair Shedding', 'Mentions pets, dogs, cats, or hair buildup');
  }

  // One-time clean vs Recurring (Branch 6)
  if (/(one time|one-time|single clean|just once|only once|deep clean only|event|party|moving out|move out|move in|single service|no recurring|don't want recurring)/i.test(normalized)) {
    addScore(6, 135, 'One-Time Clean Request', 'Customer only wants a single, standalone clean');
  }

  // Availability / Same-Day / Next-Day (Branch 19)
  if (/(tomorrow|today|next day|same day|how soon|availability|urgent|this week|weekend|saturday|sunday|earliest|come out today)/i.test(normalized)) {
    addScore(19, 130, 'Next-Day / Immediate Availability', 'Asking about immediate or weekend openings');
  }

  // Booking later / Want to book but not today (Branch 18)
  if (/(book later|not today|call me next week to book|book another time|next month to book|set it up later)/i.test(normalized)) {
    addScore(18, 120, 'Book Later / Not Today', 'Wants service but wants to finalize booking later');
  }

  // Not the right time (Branch 20)
  if (/(not the right time|bad timing|renovat|moving house|traveling|vacation|hectic right now|holidays)/i.test(normalized)) {
    addScore(20, 120, 'Not the Right Time', 'Timing is currently inconvenient for customer');
  }

  // Hesitant / Not ready / Need to think (Branch 4 & 5)
  if (/(need to think|think it over|let me think|mull it over|sleep on it|ponder)/i.test(normalized)) {
    addScore(5, 125, 'Need to Think It Over', 'Customer wants time to think through the decision');
  } else if (/(not ready|hesitant|unsure|a little unsure|on the fence|need a minute|rushed)/i.test(normalized)) {
    addScore(4, 125, 'Hesitant / Unsure to Agree', 'Customer hesitant or feeling unsure about booking now');
  }

  // Trust / Reliability / Criminal background checks (Branch 8 & 9)
  if (/(unreliable|cleaner flaked|cancelled on me|bad cleaner|stranger in my house)/i.test(normalized)) {
    addScore(8, 130, 'Reliability & Trust Concern', 'Previous bad experience or stranger trust hesitation');
  } else if (/(do a good job|clean well|thorough|quality of clean|satisfaction|standard)/i.test(normalized)) {
    addScore(9, 125, 'Cleaning Quality Assurance', 'Asking how we ensure thorough cleaning');
  }

  // Bonded & Insured (Branch 37)
  if (/(bonded|insured|carry insurance|liability insurance|break something|damage|theft|policy on breakage)/i.test(normalized)) {
    addScore(37, 140, 'Bonded & Insured Question', 'Customer asking about insurance, bonding, or breakage liability');
  }

  // Tax States / Taxes on Top (Branch 38)
  if (/(charge tax|tax on top|is tax included|sales tax|what states have tax|which states.*tax|plus tax)/i.test(normalized)) {
    addScore(38, 140, 'Sales Tax & Tax States', 'Customer asking if tax is added or which states pay tax');
  }

  // What is Included in Standard Cleaning (Branch 39)
  if (/(what is included|standard cleaning include|what do they clean|what do cleaners do|scope of clean|tasks included|wash dishes|do laundry)/i.test(normalized)) {
    addScore(39, 140, 'Standard Cleaning Scope', 'Customer asking what tasks are included in a standard clean');
  }

  // Refund / Unhappy with Clean (Branch 40)
  if (/(refund|money back|not happy with the clean|bad job|satisfaction guarantee|re-clean|if they do a bad job)/i.test(normalized)) {
    addScore(40, 145, 'Refund & Satisfaction Policy', 'Customer asking about refunds or what happens if the clean is poor');
  }

  // Cleaner Late or No-Show (Branch 41)
  if (/(late or doesn't show up|no show|didn't show up|cleaner is late|no-show|cleaner flakes|missed appointment)/i.test(normalized)) {
    addScore(41, 140, 'Late or No-Show Policy', 'Customer asking what happens if cleaner is late or misses appointment');
  }

  // Bank Flagged Charge / Card Declined (Branch 42)
  if (/(bank flagged|bank blocked|card declined|fraud alert|bank alert|payment didn't go through|transaction failed)/i.test(normalized)) {
    addScore(42, 145, 'Bank Flagged / Card Declined', 'Customer card was flagged by bank security');
  }

  // Book for Someone Else / Gift (Branch 43)
  if (/(book for someone else|for my mom|for my mother|for my parents|cleaning as a gift|for my daughter|for a friend|for family)/i.test(normalized)) {
    addScore(43, 140, 'Book for Someone Else / Gift Clean', 'Customer booking cleaning for a parent, friend, or relative');
  }

  // Someone Else Paying / 3rd Party (Branch 44)
  if (/(son or daughter pay|someone else paying|my son pays|my daughter is paying|my kid will pay|third party card|payer)/i.test(normalized)) {
    addScore(44, 140, 'Third-Party Payer', 'Customer asking if someone else can pay with their card');
  }

  // What Counts as Paid Month (Branch 45)
  if (/(what counts as a paid month|counts as a paid month|which months count|does the first month count|paid month definition)/i.test(normalized)) {
    addScore(45, 140, 'Paid Month Definition', 'Customer clarifying how paid months are counted toward 6 months');
  }

  // Why So Many Companies Calling (Branch 46)
  if (/(why are so many companies calling|why everyone calling|getting so many calls|why so many calls|how did you get my info)/i.test(normalized)) {
    addScore(46, 140, 'Multiple Call Complaints', 'Customer frustrated by multiple platform calls');
  }

  // One-Time Cleaning Prices Rate Card (Branch 47)
  if (/(one-time cleaning prices|one-time rate card|standalone clean cost|prices without membership|cost for just one clean|rate card)/i.test(normalized)) {
    addScore(47, 140, 'One-Time Rate Card', 'Customer asking for non-member one-time cleaning prices');
  }

  // Existing Customer / Not New Sale (Branch 48)
  if (/(already a customer|existing customer|already have an account|reschedule my existing clean|cancel my existing membership|customer service issue)/i.test(normalized)) {
    addScore(48, 150, 'Existing Customer Transfer', 'Customer is already an existing Homeaglow member needing account support');
  }

  // ==========================================
  // 2. Playbook Phrase, Keyword & Fuzzy Matching
  // ==========================================
  for (const branch of OBJECTION_PLAYBOOK) {
    // Exact Trigger Phrases Match
    for (const phrase of branch.triggerPhrases) {
      const phraseNorm = normalize(phrase);
      if (normalized.includes(phraseNorm)) {
        addScore(branch.id, 80, phrase, `Matched trigger phrase: "${phrase}"`);
      }
    }

    // Keyword & Token Matching
    for (const kw of branch.keywords) {
      const kwNorm = normalize(kw);
      if (!kwNorm) continue;

      if (normalized.includes(kwNorm)) {
        addScore(branch.id, 25, kw, `Matched keyword: "${kw}"`);
      } else {
        // Fuzzy distance matching for small typos (e.g. "expenisve", "cancle", "vaccum")
        for (const inputWord of meaningfulWords) {
          if (inputWord.length >= 4 && kwNorm.length >= 4) {
            const dist = levenshteinDistance(inputWord, kwNorm);
            if (dist <= 1 || (dist <= 2 && kwNorm.length >= 7)) {
              addScore(branch.id, 20, kw, `Fuzzy match on "${inputWord}" ~ "${kw}"`);
            }
          }
        }
      }
    }

    // Title words overlap
    const titleWords = normalize(branch.concernTitle).split(/\s+/).filter((w) => !STOP_WORDS.has(w));
    for (const tw of titleWords) {
      if (tw.length >= 4 && normalized.includes(tw)) {
        addScore(branch.id, 15, tw);
      }
    }
  }

  // ==========================================
  // 3. Assemble and Rank Results
  // ==========================================
  const results: MatchResult[] = [];

  for (const branch of OBJECTION_PLAYBOOK) {
    const scored = scoredMap.get(branch.id);
    if (scored && scored.score > 0) {
      const confidence: 'high' | 'medium' | 'low' =
        scored.score >= 80 ? 'high' : scored.score >= 35 ? 'medium' : 'low';
      results.push({
        branch,
        score: scored.score,
        matchedKeywords: scored.keywords,
        confidence,
        matchedReason: scored.reason
      });
    }
  }

  results.sort((a, b) => b.score - a.score);

  // GUARANTEED NEVER-EMPTY FALLBACK:
  // If the trainee typed something and no specific branch hit a trigger,
  // provide an intelligent general response rather than an empty blank screen!
  if (results.length === 0 && rawInput.length > 0) {
    // If the customer asked who is calling or why:
    const isWhoCalling = /(who is this|who are you|what is this|why are you calling|didn't ask for this|didn't sign up|how did you get my number)/i.test(normalized);

    if (isWhoCalling) {
      results.push({
        branch: {
          id: 99,
          concernTitle: 'Customer Asks: “Who is this / Why are you calling?”',
          category: 'general',
          triggerPhrases: ['who is this', 'why are you calling', 'how did you get my number'],
          keywords: ['who', 'calling', 'number', 'homeaglow'],
          acknowledge: '“Hi! My apologies for any surprise. My name is [Your Name] with Homeaglow. I’m following up on a home cleaning estimate requested recently on [Bark / Angi / Thumbtack].”',
          clarifyingQuestion: '“Before we continue, this call is recorded for quality assurance. Did you or someone in your home request a house cleaning estimate recently?”',
          verifiedResponse: '“Homeaglow connects homeowners with top-rated, background-checked independent cleaners. We offer a first 3-hour introductory clean for just $19, with ongoing service at approx $23/hour plus our $59/month membership.”',
          nextStep: '“If you are still looking for cleaning help, I can check open days this week. If it was placed by mistake, I can immediately update your preferences so you aren’t contacted again.”'
        },
        score: 40,
        matchedKeywords: ['caller identification'],
        confidence: 'medium',
        matchedReason: 'Customer asked who is calling or referenced caller identity'
      });
    } else {
      // General hesitation fallback (Branch 4) with clear prompt
      const fallbackBranch = OBJECTION_PLAYBOOK.find((b) => b.id === 4) || OBJECTION_PLAYBOOK[0];
      results.push({
        branch: {
          ...fallbackBranch,
          concernTitle: 'Customer Question / General Inquiry',
          acknowledge: '“I completely understand. I want to make sure you have all the facts and clear numbers for your home.”',
          clarifyingQuestion: '“Just so I can give you the exact details, what is the biggest thing on your mind right now—the pricing, how the schedule works, or the cleaning scope?”',
          verifiedResponse: '“Homeaglow offers background-checked cleaners starting at $19 for your first introductory clean (covers month 1 membership). Ongoing visits are approximately $23/hour plus our $59 monthly membership. There are zero hidden fees, and all terms are laid out upfront.”',
          nextStep: '“Does that give you a helpful overview, or would you like to check what dates are open in your ZIP code this week?”'
        },
        score: 20,
        matchedKeywords: ['general inquiry'],
        confidence: 'low',
        matchedReason: 'Closest general inquiry response based on your query'
      });
    }
  }

  return results;
}

// Default export for general backwards compatibility
const VALUE_STATEMENTS: ValueStatement[] = VALUE_STATEMENTS_BY_SOURCE.Bark;

// Helper to get matching verbatim value statement by category and lead source
function getVerbatimValueStatement(
  category: 'price' | 'commitment' | 'uncertainty' | 'competitors' | 'trust' | 'operations' | 'boundary' | 'faq' | 'general' | 'value',
  leadSource: LeadSource,
  spielIndex = 0
): { title: string; spiel: string; allSpiels: string[]; categoryId: string } {
  const sourceStatements = VALUE_STATEMENTS_BY_SOURCE[leadSource] || VALUE_STATEMENTS_BY_SOURCE.Bark;

  let targetId = 'price-and-value';
  if (category === 'trust') {
    targetId = 'vetted-cleaners';
  } else if (category === 'competitors') {
    targetId = 'vetted-cleaners';
  } else if (category === 'uncertainty' || category === 'commitment') {
    targetId = 'schedule-flexibility';
  } else if (category === 'operations') {
    targetId = 'cleaner-availability';
  } else if (category === 'faq') {
    targetId = 'support-24-7';
  } else if (category === 'boundary') {
    targetId = 'schedule-flexibility';
  }

  const found = sourceStatements.find((vs) => vs.id === targetId) || sourceStatements[1];
  const safeIndex = spielIndex % found.spiels.length;
  return {
    title: found.title,
    spiel: found.spiels[safeIndex],
    allSpiels: found.spiels,
    categoryId: found.id
  };
}

interface SaveAttemptTrackerProps {
  leadSource: LeadSource;
  completedAttempts: number[];
  onToggleAttempt: (attemptNumber: number) => void;
  onResetAttempts: () => void;
}

const SaveAttemptTracker: React.FC<SaveAttemptTrackerProps> = ({
  leadSource,
  completedAttempts,
  onToggleAttempt,
  onResetAttempts
}) => {
  const targetCount = LEAD_SOURCE_INFO[leadSource]?.requiredSavesCount || 3;
  const currentCount = completedAttempts.filter((num) => num <= targetCount).length;
  const isRequirementMet = currentCount >= targetCount;

  return (
    <div className="bg-white rounded-xl border border-[#E6C8B7] shadow-xs p-3.5 space-y-3">
      {/* Header Bar */}
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <div className="w-6 h-6 rounded-md bg-[#BA6A36] text-white flex items-center justify-center font-bold">
            <Target className="w-3.5 h-3.5" />
          </div>
          <span className="text-xs sm:text-sm font-extrabold text-[#1C3934]">
            Save-Attempt Tracker: <span className="text-[#BA6A36]">{leadSource}</span>
          </span>
          <span className="text-[10px] bg-[#E6C8B7]/60 text-[#1C3934] font-bold px-2 py-0.5 rounded-full">
            Required: {targetCount} {targetCount === 1 ? 'Attempt' : 'Attempts'}
          </span>
        </div>

        {completedAttempts.length > 0 && (
          <button
            type="button"
            onClick={onResetAttempts}
            className="text-xs text-[#BA6A36] hover:underline flex items-center gap-1 font-bold cursor-pointer"
          >
            <RotateCcw className="w-3 h-3" />
            <span>Reset</span>
          </button>
        )}
      </div>

      {/* Simple Clickable Attempt Tabs */}
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
        {Array.from({ length: targetCount }).map((_, idx) => {
          const attemptNum = idx + 1;
          const isDone = completedAttempts.includes(attemptNum);

          return (
            <button
              key={attemptNum}
              type="button"
              onClick={() => onToggleAttempt(attemptNum)}
              className={`p-2.5 rounded-lg border text-xs font-bold transition-all cursor-pointer flex items-center justify-between ${
                isDone
                  ? 'bg-emerald-600 text-white border-emerald-700 shadow-xs'
                  : 'bg-[#F9EDF0] text-[#1C3934] border-[#E6C8B7] hover:bg-[#E6C8B7]/40'
              }`}
            >
              <div className="flex items-center gap-1.5">
                <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-black ${
                  isDone ? 'bg-white text-emerald-800' : 'bg-[#E6C8B7] text-[#1C3934]'
                }`}>
                  {attemptNum}
                </span>
                <span>Attempt {attemptNum}</span>
              </div>

              <span className={`text-[10px] uppercase tracking-wider font-extrabold px-1.5 py-0.5 rounded ${
                isDone ? 'bg-white/20 text-white' : 'bg-white text-[#261311]/60 border border-[#E6C8B7]'
              }`}>
                {isDone ? '✓ Made' : 'Click if Made'}
              </span>
            </button>
          );
        })}
      </div>

      {/* Prompt Status Banner */}
      {isRequirementMet ? (
        <div className="bg-emerald-50 border border-emerald-400 rounded-lg p-2.5 text-emerald-950 text-xs flex items-center gap-2">
          <CheckCircle2 className="w-4 h-4 text-emerald-600 shrink-0" />
          <div className="leading-snug">
            <span className="font-extrabold text-emerald-800 mr-1">
              🎉 Requirement Met ({currentCount} / {targetCount} on {leadSource})!
            </span>
            <span>If the customer is still hesitant, you are now cleared to schedule a firm callback (confirm day, time, timezone, and phone number).</span>
          </div>
        </div>
      ) : (
        <div className="bg-amber-50 border border-amber-300 rounded-lg p-2.5 text-amber-950 text-xs flex items-center gap-2">
          <AlertCircle className="w-4 h-4 text-amber-600 shrink-0" />
          <div className="leading-snug">
            <span className="font-bold text-amber-900 mr-1">
              ⚠️ {currentCount} of {targetCount} required attempts made on {leadSource}.
            </span>
            <span className="text-amber-900/80">
              {leadSource === 'Angi'
                ? 'Angi requires at least 1 genuine attempt before scheduling a callback.'
                : `VoiceLab requires at least 3 genuine attempts on ${leadSource} before scheduling a callback.`}
            </span>
          </div>
        </div>
      )}
    </div>
  );
};
