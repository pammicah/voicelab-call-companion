interface SimpleDashboardProps {
  logs: CallLog[];
  onAddLog: (log: Omit<CallLog, 'id' | 'timestamp' | 'passed'>) => void;
  onDeleteLog: (id: string) => void;
  onDeleteTrainee: (traineeName: string) => void;
  onClearAllLogs: () => void;
  activeTrainee: string;
  onSelectTrainee: (name: string) => void;
  currentLeadSource: LeadSource;
}

const COMMON_HIGHLIGHT_SUGGESTIONS = [
  'Offered Premium Cleaner Program (+0.2 QA bonus)',
  'Clear recording notice verbatim',
  'Identified as Homeaglow immediately',
  'Smooth pricing & terms delivery ($19 / $59 / ~$23/hr)',
  'Disclosed up to $75 card hold clearly',
  'Genuine save attempt before scheduling callback',
  'One discovery question at a time',
  'Clear explanation of $35/hr early cancellation fee',
  'Confident close with two specific date/time options'
];

const COMMON_OPPORTUNITY_SUGGESTIONS = [
  'Forgot Premium Cleaner Program upsell (-0.2 QA penalty)',
  'Forgot to ask ZIP code early (Bark rule)',
  'Scheduled callback without attempting a save',
  'Missed card hold disclosure (up to $75 hold)',
  'Did not introduce as Homeaglow within 10 seconds',
  'Stacked multiple discovery questions together',
  'Forgot to explain early cancellation fee ($35/hr)',
  'Vague callback without exact time or timezone',
  'Sounded like calling from Angi/Thumbtack directly',
  'Promised unverified supplies or cleaner continuity'
];

const SimpleDashboard: React.FC<SimpleDashboardProps> = ({
  logs,
  onAddLog,
  onDeleteLog,
  onDeleteTrainee,
  onClearAllLogs,
  activeTrainee,
  onSelectTrainee,
  currentLeadSource
}) => {
  const [traineeNameInput, setTraineeNameInput] = useState(activeTrainee || '');
  const [scoreInput, setScoreInput] = useState<number | ''>(85);
  const [selectedSource, setSelectedSource] = useState<LeadSource>(currentLeadSource);
  const [highlightInput, setHighlightInput] = useState('');
  const [opportunityInput, setOpportunityInput] = useState('');

  // In-UI Confirmation States (Avoids window.confirm which fails in iframes!)
  const [confirmDeleteTrainee, setConfirmDeleteTrainee] = useState<string | null>(null);
  const [confirmDeleteLogId, setConfirmDeleteLogId] = useState<string | null>(null);
  const [confirmResetAll, setConfirmResetAll] = useState<boolean>(false);

  // Group performance by trainee name
  const traineeMap = new Map<string, { total: number; passed: number; lastTime: number; highlights: string[]; opportunities: string[] }>();

  logs.forEach((log) => {
    const name = log.traineeName.trim();
    if (!name) return;
    const existing = traineeMap.get(name) || {
      total: 0,
      passed: 0,
      lastTime: 0,
      highlights: [],
      opportunities: []
    };
    existing.total += 1;
    if (log.score >= 75) {
      existing.passed += 1;
    }
    if (log.timestamp > existing.lastTime) {
      existing.lastTime = log.timestamp;
    }
    if (log.highlight) {
      existing.highlights.push(log.highlight);
    }
    if (log.opportunity) {
      existing.opportunities.push(log.opportunity);
    }
    traineeMap.set(name, existing);
  });

  const performances: TraineePerformance[] = Array.from(traineeMap.entries())
    .map(([traineeName, data]) => ({
      traineeName,
      totalCalls: data.total,
      passedCalls: data.passed,
      passRate: data.total > 0 ? Math.round((data.passed / data.total) * 100) : 0,
      lastCallTime: data.lastTime,
      highlights: data.highlights,
      opportunities: data.opportunities
    }))
    .sort((a, b) => b.lastCallTime - a.lastCallTime);

  // Currently focused trainee for unique coaching insights
  const selectedTraineeName = activeTrainee && traineeMap.has(activeTrainee)
    ? activeTrainee
    : performances[0]?.traineeName || '';

  const currentTraineeData = traineeMap.get(selectedTraineeName);
  const currentTraineeLogs = logs.filter(
    (l) => l.traineeName.toLowerCase() === selectedTraineeName.toLowerCase()
  );

  // Compute unique mistakes/opportunities for this specific trainee
  const traineeOpportunityCounts = new Map<string, number>();
  currentTraineeLogs.forEach((l) => {
    if (!l.opportunity) return;
    const trimmed = l.opportunity.trim();
    if (!trimmed) return;
    traineeOpportunityCounts.set(trimmed, (traineeOpportunityCounts.get(trimmed) || 0) + 1);
  });

  const traineeSortedOpportunities = Array.from(traineeOpportunityCounts.entries())
    .map(([text, count]) => ({ text, count }))
    .sort((a, b) => b.count - a.count);

  // Compute unique highlights for this specific trainee
  const traineeHighlightCounts = new Map<string, number>();
  currentTraineeLogs.forEach((l) => {
    if (!l.highlight) return;
    const trimmed = l.highlight.trim();
    if (!trimmed) return;
    traineeHighlightCounts.set(trimmed, (traineeHighlightCounts.get(trimmed) || 0) + 1);
  });

  const traineeSortedHighlights = Array.from(traineeHighlightCounts.entries())
    .map(([text, count]) => ({ text, count }))
    .sort((a, b) => b.count - a.count);

  const handleLogSubmit = (e: React.FormEvent) => {
    e.preventDefault();
    const cleanName = traineeNameInput.trim();
    if (!cleanName || scoreInput === '') return;

    const numScore = Math.min(100, Math.max(0, Number(scoreInput)));
    onAddLog({
      traineeName: cleanName,
      leadSource: selectedSource,
      score: numScore,
      highlight: highlightInput.trim() || undefined,
      opportunity: opportunityInput.trim() || undefined
    });

    onSelectTrainee(cleanName);
    setScoreInput('');
    setHighlightInput('');
    setOpportunityInput('');
  };

  return (
    <div className="bg-white rounded-xl border border-[#E6C8B7] p-5 shadow-sm space-y-6">
      {/* Header */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-[#E6C8B7] pb-4">
        <div className="flex items-center gap-2.5">
          <div className="w-8 h-8 rounded-lg bg-[#BA6A36] text-white flex items-center justify-center font-black">
            <BarChart3 className="w-5 h-5" />
          </div>
          <div>
            <div className="flex items-center gap-2">
              <h3 className="text-base sm:text-lg font-extrabold text-[#1C3934]">
                Trainee Performance & Coaching Dashboard
              </h3>
              <span className="text-[10px] bg-[#E6C8B7]/60 text-[#1C3934] font-bold px-2 py-0.5 rounded-full">
                75%+ Pass Benchmark
              </span>
            </div>
            <p className="text-xs text-[#261311]/70">
              Unique per-trainee pass ratio (passed calls vs total calls logged) and personalized coaching insights.
            </p>
          </div>
        </div>

        {logs.length > 0 && (
          <div className="self-start sm:self-auto">
            {confirmResetAll ? (
              <div className="flex items-center gap-1.5 bg-red-50 p-1.5 rounded-lg border border-red-300 text-xs">
                <span className="font-bold text-red-900">Clear all records?</span>
                <button
                  type="button"
                  onClick={() => {
                    onClearAllLogs();
                    setConfirmResetAll(false);
                  }}
                  className="bg-red-700 text-white px-2 py-0.5 rounded text-[11px] font-bold cursor-pointer"
                >
                  Yes, Reset All
                </button>
                <button
                  type="button"
                  onClick={() => setConfirmResetAll(false)}
                  className="bg-white text-gray-700 px-2 py-0.5 rounded text-[11px] font-bold border border-gray-300 cursor-pointer"
                >
                  Cancel
                </button>
              </div>
            ) : (
              <button
                type="button"
                onClick={() => setConfirmResetAll(true)}
                className="text-xs text-red-700 hover:text-red-900 flex items-center gap-1 bg-red-50 hover:bg-red-100 px-2.5 py-1 rounded-md border border-red-200 font-bold cursor-pointer transition-colors"
              >
                <Trash2 className="w-3.5 h-3.5" />
                <span>Reset All Data</span>
              </button>
            )}
          </div>
        )}
      </div>

      {/* Trainees Performance Table (Log Summary) with In-UI Deletion */}
      <div>
        <div className="flex items-center justify-between mb-2">
          <h4 className="text-xs sm:text-sm font-bold text-[#1C3934] uppercase tracking-wider flex items-center gap-1.5">
            <Users className="w-4 h-4 text-[#BA6A36]" />
            Trainee Call Log Summary
          </h4>
          <span className="text-[11px] text-[#261311]/60">
            Click any trainee to view their unique coaching insights
          </span>
        </div>

        {performances.length === 0 ? (
          <div className="p-8 bg-[#F9EDF0]/50 rounded-xl border border-dashed border-[#C3955B]/40 text-center text-xs text-[#261311]/70 space-y-2">
            <Users className="w-8 h-8 text-[#C3955B] mx-auto opacity-70" />
            <p className="font-extrabold text-[#1C3934] text-sm">No trainee calls logged yet.</p>
            <p className="max-w-md mx-auto">
              This dashboard starts blank. Enter your name, score, and coaching notes in the form below to begin tracking.
            </p>
          </div>
        ) : (
          <div className="overflow-x-auto rounded-lg border border-[#E6C8B7]">
            <table className="w-full text-left text-xs">
              <thead className="bg-[#1C3934] text-[#F9EDF0]">
                <tr>
                  <th className="py-2.5 px-3 font-bold uppercase tracking-wider">Trainee Name</th>
                  <th className="py-2.5 px-3 font-bold uppercase tracking-wider text-center">Passed Calls</th>
                  <th className="py-2.5 px-3 font-bold uppercase tracking-wider text-center">Total Calls Logged</th>
                  <th className="py-2.5 px-3 font-bold uppercase tracking-wider text-center">Score Ratio</th>
                  <th className="py-2.5 px-3 font-bold uppercase tracking-wider text-center">Phone-Ready Status</th>
                  <th className="py-2.5 px-3 font-bold uppercase tracking-wider text-center text-red-200">Delete Trainee</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-[#E6C8B7]/60 bg-white">
                {performances.map((p) => {
                  const isPassingTier = p.passRate >= 70;
                  const isSelected = p.traineeName.toLowerCase() === selectedTraineeName.toLowerCase();
                  const isConfirming = confirmDeleteTrainee === p.traineeName;

                  return (
                    <tr
                      key={p.traineeName}
                      className={`hover:bg-[#F9EDF0]/60 transition-colors ${
                        isSelected ? 'bg-[#E6C8B7]/30 font-semibold' : ''
                      }`}
                    >
                      <td
                        className="py-2.5 px-3 cursor-pointer"
                        onClick={() => {
                          onSelectTrainee(p.traineeName);
                          setTraineeNameInput(p.traineeName);
                        }}
                      >
                        <div className="flex items-center gap-1.5">
                          <UserCheck className="w-3.5 h-3.5 text-[#BA6A36]" />
                          <span className="font-extrabold text-[#1C3934] text-sm">{p.traineeName}</span>
                          {isSelected && (
                            <span className="text-[10px] bg-[#BA6A36] text-white px-1.5 py-0.2 rounded font-bold">
                              Viewing
                            </span>
                          )}
                        </div>
                      </td>

                      <td className="py-2.5 px-3 text-center font-black text-emerald-800 text-sm">
                        {p.passedCalls}
                      </td>

                      <td className="py-2.5 px-3 text-center font-bold text-[#261311] text-sm">
                        {p.totalCalls}
                      </td>

                      <td className="py-2.5 px-3 text-center font-mono font-bold text-xs">
                        <span className="text-emerald-700">{p.passedCalls}</span>
                        <span className="text-[#261311]/50 mx-1">/</span>
                        <span className="text-[#1C3934]">{p.totalCalls}</span>
                        <span className="text-[#261311]/60 ml-1.5 font-normal">({p.passRate}%)</span>
                      </td>

                      <td className="py-2.5 px-3 text-center">
                        <span
                          className={`inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-1 rounded-full ${
                            isPassingTier
                              ? 'bg-emerald-100 text-emerald-800 border border-emerald-300'
                              : 'bg-amber-100 text-amber-900 border border-amber-300'
                          }`}
                        >
                          {isPassingTier ? (
                            <>
                              <CheckCircle2 className="w-3.5 h-3.5" />
                              <span>Ready (70%+ passing)</span>
                            </>
                          ) : (
                            <>
                              <XCircle className="w-3.5 h-3.5" />
                              <span>Needs More Passes</span>
                            </>
                          )}
                        </span>
                      </td>

                      {/* In-UI Deletion Cell */}
                      <td className="py-2.5 px-3 text-center">
                        {isConfirming ? (
                          <div className="inline-flex items-center gap-1 bg-red-50 p-1 rounded border border-red-300 text-[11px]">
                            <span className="text-red-900 font-bold">Delete?</span>
                            <button
                              type="button"
                              onClick={(e) => {
                                e.stopPropagation();
                                onDeleteTrainee(p.traineeName);
                                setConfirmDeleteTrainee(null);
                              }}
                              className="bg-red-700 text-white px-1.5 py-0.5 rounded font-bold cursor-pointer hover:bg-red-800"
                            >
                              Yes
                            </button>
                            <button
                              type="button"
                              onClick={(e) => {
                                e.stopPropagation();
                                setConfirmDeleteTrainee(null);
                              }}
                              className="bg-white text-gray-700 px-1.5 py-0.5 rounded font-bold border border-gray-300 cursor-pointer"
                            >
                              No
                            </button>
                          </div>
                        ) : (
                          <button
                            type="button"
                            onClick={(e) => {
                              e.stopPropagation();
                              setConfirmDeleteTrainee(p.traineeName);
                            }}
                            className="text-red-700 hover:text-red-900 bg-red-50 hover:bg-red-100 p-1.5 rounded cursor-pointer border border-red-200 transition-colors inline-flex items-center gap-1"
                            title={`Delete all logs for ${p.traineeName}`}
                          >
                            <Trash2 className="w-3.5 h-3.5" />
                            <span className="text-[10px] font-bold">Delete</span>
                          </button>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* Trainee-Specific Coaching Insights (Unique Per Trainee) */}
      {performances.length > 0 && selectedTraineeName && (
        <div className="space-y-4 pt-3 border-t-2 border-[#E6C8B7]">
          {/* Trainee Switcher Tabs */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <h4 className="text-sm sm:text-base font-black text-[#1C3934] flex items-center gap-1.5">
                <Lightbulb className="w-4 h-4 text-[#BA6A36]" />
                Personalized Coaching Insights for: <span className="text-[#BA6A36] underline">{selectedTraineeName}</span>
              </h4>
              <p className="text-xs text-[#261311]/70">
                Unique coaching opportunities and strengths calculated specifically for {selectedTraineeName}.
              </p>
            </div>

            {/* Quick Trainee Tabs */}
            <div className="flex flex-wrap gap-1">
              {performances.map((p) => {
                const isSelected = p.traineeName.toLowerCase() === selectedTraineeName.toLowerCase();
                return (
                  <button
                    key={p.traineeName}
                    type="button"
                    onClick={() => {
                      onSelectTrainee(p.traineeName);
                      setTraineeNameInput(p.traineeName);
                    }}
                    className={`px-3 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                      isSelected
                        ? 'bg-[#1C3934] text-[#F9EDF0] shadow-xs'
                        : 'bg-[#F9EDF0] text-[#1C3934] hover:bg-[#E6C8B7]/50 border border-[#E6C8B7]'

                  >
                    {p.traineeName} ({p.passedCalls}/{p.totalCalls})

            </div>
          </div>

          {/* Unique Trainee Metrics & Insights */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {/* Opportunities (Mistakes to Focus On) for this specific trainee */}
            <div className="bg-amber-50/70 border border-amber-300 rounded-xl p-4 space-y-2.5">
              <div className="flex items-center justify-between">
                <div className="text-xs font-extrabold text-amber-900 uppercase tracking-wider flex items-center gap-1.5">
                  <AlertTriangle className="w-4 h-4 text-[#BA6A36]" />
                  What {selectedTraineeName} Needs to Focus On ({traineeSortedOpportunities.length})

                <span className="text-[10px] bg-amber-200 text-amber-900 font-bold px-2 py-0.5 rounded">
                  Personalized Focus
                </span>
              </div>

              {traineeSortedOpportunities.length === 0 ? (
                <p className="text-xs text-amber-900/70 italic py-2">
                  No mistakes or opportunities logged for {selectedTraineeName} yet.

                <div className="space-y-2">
                  {traineeSortedOpportunities.map((item, idx) => (
                    <div
                      key={idx}
                      className="bg-white p-2.5 rounded-lg border border-amber-200 text-xs shadow-xs flex items-start justify-between gap-2"
                    >
                      <div className="space-y-0.5">
                        <div className="font-bold text-[#1C3934] leading-snug">

                        <div className="text-[11px] text-[#261311]/70">

                          {item.text.toLowerCase().includes('save') && 'Tip: Use the Save Attempt Tracker: 3 attempts on Thumbtack/Bark, 1 on Angi.'}
                          {item.text.toLowerCase().includes('card hold') && 'Tip: Read card hold disclosure (up to $75 hold) word-for-word on recorded line.'}
                          {item.text.toLowerCase().includes('etf') && 'Tip: State exact early cancellation math ($35/hr of first clean).'}
                          {!item.text.toLowerCase().includes('bark') &&
                           !item.text.toLowerCase().includes('save') &&
                           !item.text.toLowerCase().includes('card hold') &&

                    </div>

            </div>

            {/* Top Highlights & Strengths for this specific trainee */}
            <div className="bg-emerald-50/70 border border-emerald-300 rounded-xl p-4 space-y-2.5">
              <div className="flex items-center justify-between">
                <div className="text-xs font-extrabold text-emerald-900 uppercase tracking-wider flex items-center gap-1.5">

              ) : (
                <div className="space-y-2">
                  {traineeSortedHighlights.map((item, idx) => (
                    <div
                      key={idx}
                      className="bg-white p-2.5 rounded-lg border border-emerald-200 text-xs shadow-xs flex items-center justify-between gap-2"
                    >
                      <div className="font-bold text-[#1C3934] leading-snug">

                      </div>
                      <span className="text-[10px] font-extrabold bg-emerald-100 text-emerald-900 px-2 py-1 rounded-full whitespace-nowrap border border-emerald-300">

                    </div>

                </div>
              )}

      {/* Log Call Result Form */}
      <form onSubmit={handleLogSubmit} className="bg-[#F9EDF0]/70 p-4 rounded-xl border border-[#E6C8B7] space-y-4">
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-1.5 text-xs font-bold text-[#1C3934] uppercase tracking-wider">
            <PlusCircle className="w-4 h-4 text-[#BA6A36]" />

          </div>
          <span className="text-[11px] text-[#261311]/70">
            Pass benchmark: <strong>75%+</strong>

        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">

          <div>
            <label className="block text-xs font-bold text-[#1C3934] mb-1">

            </label>
            <input
              type="text"
              required
              value={traineeNameInput}
              onChange={(e) => setTraineeNameInput(e.target.value)}

          {/* Lead Source */}
          <div>
            <label className="block text-xs font-bold text-[#1C3934] mb-1">

            <select
              value={selectedSource}
              onChange={(e) => setSelectedSource(e.target.value as LeadSource)}

            >
              <option value="Thumbtack">Thumbtack</option>
              <option value="Angi">Angi</option>
              <option value="Bark">Bark</option>
            </select>
          </div>

          {/* Call Score */}
          <div>
            <label className="block text-xs font-bold text-[#1C3934] mb-1">
              VoiceLab Score (0 - 100%) *
            </label>
            <input
              type="number"
              required
              min="0"
              max="100"
              value={scoreInput}
              onChange={(e) => setScoreInput(e.target.value === '' ? '' : Number(e.target.value))}
              placeholder="e.g. 75, 88, 94"
              className="w-full text-xs p-2.5 rounded-lg border border-[#C3955B] bg-white text-[#261311] focus:outline-none focus:ring-1 focus:ring-[#BA6A36] font-medium"
            />
          </div>
        </div>

        {/* Coaching Highlight Input & Quick Tags */}
        <div className="space-y-1.5">
          <label className="block text-xs font-bold text-[#1C3934]">
            Coaching Highlight (What went well on this call?)
          </label>
          <input
            type="text"
            value={highlightInput}
            onChange={(e) => setHighlightInput(e.target.value)}
            placeholder="Type your highlight or click a common strength below..."
            className="w-full text-xs p-2.5 rounded-lg border border-[#C3955B] bg-white text-[#261311] focus:outline-none focus:ring-1 focus:ring-[#BA6A36]"
          />
          <div className="flex flex-wrap gap-1 pt-0.5">
            {COMMON_HIGHLIGHT_SUGGESTIONS.slice(0, 4).map((tag) => (
              <button
                key={tag}
                type="button"
                onClick={() => setHighlightInput(tag)}
                className="text-[11px] bg-white hover:bg-emerald-50 text-[#1C3934] px-2 py-0.5 rounded border border-[#E6C8B7] cursor-pointer"
              >
                + {tag}
              </button>
            ))}
          </div>
        </div>

        {/* Coaching Opportunity Input & Quick Tags */}
        <div className="space-y-1.5">
          <label className="block text-xs font-bold text-[#1C3934]">
            Coaching Opportunity / Mistake (What will you improve / mistake to fix?)
          </label>
          <input
            type="text"
            value={opportunityInput}
            onChange={(e) => setOpportunityInput(e.target.value)}
            placeholder="Type your mistake or what to fix, or click a common tag below..."
            className="w-full text-xs p-2.5 rounded-lg border border-[#C3955B] bg-white text-[#261311] focus:outline-none focus:ring-1 focus:ring-[#BA6A36]"
          />
          <div className="flex flex-wrap gap-1 pt-0.5">
            {COMMON_OPPORTUNITY_SUGGESTIONS.slice(0, 4).map((tag) => (
              <button
                key={tag}
                type="button"
                onClick={() => setOpportunityInput(tag)}
                className="text-[11px] bg-white hover:bg-amber-50 text-[#1C3934] px-2 py-0.5 rounded border border-[#E6C8B7] cursor-pointer"
              >
                + {tag}
              </button>
            ))}
          </div>
        </div>

        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pt-2 border-t border-[#E6C8B7]">
          <span className="text-[11px] text-[#261311]/70">
            Scores <strong>75% and above</strong> count as passing calls. Data updates immediately on the dashboard.
          </span>
          <button
            type="submit"
            className="bg-[#BA6A36] hover:bg-[#BA6A36]/90 text-white px-5 py-2.5 rounded-lg text-xs font-bold shadow-xs cursor-pointer transition-colors self-end sm:self-auto"
          >
            Submit Scored Call Log
          </button>
        </div>
      </form>

      {/* Individual Logged Calls List (With In-UI Delete Button) */}
      {currentTraineeLogs.length > 0 && (
        <div className="space-y-2 border-t border-[#E6C8B7] pt-4">
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-[#1C3934]">
              Recent Scored Calls for {selectedTraineeName} ({currentTraineeLogs.length})
            </span>
            <span className="text-[11px] text-[#261311]/60">
              Trash icon removes individual call records
            </span>
          </div>

          <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
            {currentTraineeLogs.map((log) => {
              const dateStr = new Date(log.timestamp).toLocaleDateString([], {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
              });
              const isConfirming = confirmDeleteLogId === log.id;

              return (
                <div
                  key={log.id}
                  className="p-3 bg-white rounded-lg border border-[#E6C8B7] shadow-xs text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2"
                >
                  <div className="space-y-1">
                    <div className="flex items-center gap-2">
                      <span className="font-extrabold text-[#1C3934] text-sm">
                        {log.traineeName}
                      </span>
                      <span className="text-[10px] bg-[#E6C8B7]/40 text-[#1C3934] px-1.5 py-0.2 rounded font-bold">
                        {log.leadSource}
                      </span>
                      <span
                        className={`font-mono font-bold text-xs px-2 py-0.5 rounded-full ${
                          log.score >= 75
                            ? 'bg-emerald-100 text-emerald-800 border border-emerald-300'
                            : 'bg-red-100 text-red-800 border border-red-300'
                        }`}
                      >
                        {log.score}% {log.score >= 75 ? 'Passed' : 'Failed'}
                      </span>
                      <span className="text-[10px] text-[#261311]/50">{dateStr}</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1 text-[11px]">
                      {log.highlight && (
                        <div className="text-emerald-800 flex items-start gap-1">
                          <span className="font-bold">Highlight:</span>
                          <span>{log.highlight}</span>
                        </div>
                      )}
                      {log.opportunity && (
                        <div className="text-amber-900 flex items-start gap-1">
                          <span className="font-bold">Opportunity:</span>
                          <span>{log.opportunity}</span>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* In-UI Call Deletion */}
                  <div className="self-end sm:self-center">
                    {isConfirming ? (
                      <div className="flex items-center gap-1 bg-red-50 p-1 rounded border border-red-300 text-[11px]">
                        <span className="text-red-900 font-bold">Delete?</span>
                        <button
                          type="button"
                          onClick={() => {
                            onDeleteLog(log.id);
                            setConfirmDeleteLogId(null);
                          }}
                          className="bg-red-700 text-white px-2 py-0.5 rounded font-bold cursor-pointer hover:bg-red-800"
                        >
                          Yes
                        </button>
                        <button
                          type="button"
                          onClick={() => setConfirmDeleteLogId(null)}
                          className="bg-white text-gray-700 px-2 py-0.5 rounded font-bold border border-gray-300 cursor-pointer"
                        >
                          No
                        </button>
                      </div>
                    ) : (
                      <button
                        type="button"
                        onClick={() => setConfirmDeleteLogId(log.id)}
                        className="text-red-700 hover:text-red-900 bg-red-50 hover:bg-red-100 p-1.5 rounded cursor-pointer border border-red-200 transition-colors inline-flex items-center gap-1"
                        title="Delete this call log"
                      >
                        <Trash2 className="w-3.5 h-3.5" />
                        <span className="text-[10px] font-bold">Delete</span>
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
};

const STORAGE_KEY_CALL_LOGS = 'voicelab_trainee_call_logs_v2';
const STORAGE_KEY_ACTIVE_TRAINEE = 'voicelab_active_trainee_v2';
const STORAGE_KEY_ACTIVE_LEAD = 'voicelab_active_lead_v2';

function App() {
  const [leadSource, setLeadSource] = useState<LeadSource>(() => {
    return (localStorage.getItem(STORAGE_KEY_ACTIVE_LEAD) as LeadSource) || 'Thumbtack';
  });

  const [activeTrainee, setActiveTrainee] = useState<string>(() => {
    return localStorage.getItem(STORAGE_KEY_ACTIVE_TRAINEE) || '';
  });

  // Blank by default until a trainee logs calls
  const [callLogs, setCallLogs] = useState<CallLog[]>(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY_CALL_LOGS);
      if (saved) {
        return JSON.parse(saved);
      }
    } catch (e) {
      console.error('Failed reading call logs from localStorage', e);
    }
    return [];
  });

  // Simple save attempts tracker: array of attempt numbers made (e.g. [1, 2])
  const [completedAttempts, setCompletedAttempts] = useState<number[]>([]);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY_ACTIVE_LEAD, leadSource);
  }, [leadSource]);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY_ACTIVE_TRAINEE, activeTrainee);
  }, [activeTrainee]);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY_CALL_LOGS, JSON.stringify(callLogs));
  }, [callLogs]);

  const handleAddLog = (newLog: Omit<CallLog, 'id' | 'timestamp' | 'passed'>) => {
    const entry: CallLog = {
      ...newLog,
      id: 'call-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
      timestamp: Date.now(),
      passed: newLog.score >= 75
    };
    setCallLogs([entry, ...callLogs]);
    setActiveTrainee(newLog.traineeName);
  };

  const handleDeleteLog = (id: string) => {
    setCallLogs((prev) => prev.filter((l) => l.id !== id));
  };

  const handleDeleteTrainee = (traineeName: string) => {
    setCallLogs((prev) => prev.filter((l) => l.traineeName.toLowerCase() !== traineeName.toLowerCase()));
    if (activeTrainee.toLowerCase() === traineeName.toLowerCase()) {
      setActiveTrainee('');
    }
  };

  const handleClearAllLogs = () => {
    setCallLogs([]);
    setActiveTrainee('');
  };

  const handleToggleSaveAttempt = (attemptNum: number) => {
    setCompletedAttempts((prev) =>
      prev.includes(attemptNum)
        ? prev.filter((n) => n !== attemptNum)
        : [...prev, attemptNum]
    );
  };

  const handleResetSaveAttempts = () => {
    setCompletedAttempts([]);
  };

  // Trainee stats for active trainee if selected
  const activeTraineeLogs = activeTrainee
    ? callLogs.filter((l) => l.traineeName.toLowerCase() === activeTrainee.toLowerCase())
    : [];
  const activeTotal = activeTraineeLogs.length;
  const activePassed = activeTraineeLogs.filter((l) => l.passed).length;

  return (
    <div className="min-h-screen bg-[#F9EDF0] text-[#261311] flex flex-col font-sans">
      {/* Top Application Header */}
      <header className="bg-[#1C3934] text-[#F9EDF0] border-b-2 border-[#C3955B] sticky top-0 z-30 shadow-md">
        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-[#BA6A36] text-[#F9EDF0] flex items-center justify-center font-black shadow-sm">
              <Headphones className="w-5 h-5" />
            </div>
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-lg sm:text-xl font-extrabold tracking-tight">
                  VoiceLab Call Companion
                </h1>
                <span className="text-[10px] bg-[#C3955B] text-[#261311] font-extrabold uppercase px-2 py-0.5 rounded">
                  One-Pager
                </span>
              </div>
              <p className="text-xs text-[#E6C8B7]">
                Live spoken scripts, objection spiels, save-attempt tracker & per-trainee coaching
              </p>
            </div>
          </div>

          {/* Quick Active Trainee Summary Badge if Trainee Logged */}
          {activeTrainee && (
            <div className="flex items-center gap-2 bg-[#261311]/70 px-3 py-1.5 rounded-lg border border-[#C3955B]/40 text-xs text-[#F9EDF0] self-start sm:self-auto">
              <span className="text-[#E6C8B7]">Active Trainee:</span>
              <span className="font-extrabold text-[#F9EDF0]">{activeTrainee}</span>
              <span className="text-[#C3955B]">|</span>
              <span className="font-bold text-emerald-300">
                {activePassed} passed / {activeTotal} logged
              </span>
            </div>
          )}
        </div>
      </header>

      {/* Main Single Page Layout */}
      <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
        {/* Lead Source Selector Bar */}
        <div className="bg-[#1C3934] text-[#F9EDF0] p-3.5 rounded-xl border border-[#C3955B]/30 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div className="flex items-center gap-2">
            <span className="text-xs uppercase tracking-wider text-[#E6C8B7] font-bold">
              Choose Lead Source:
            </span>
            <div className="inline-flex rounded-lg p-1 bg-[#261311]/60 border border-[#C3955B]/40">
              {(['Thumbtack', 'Angi', 'Bark'] as LeadSource[]).map((src) => {
                const isSelected = src === leadSource;
                return (
                  <button
                    key={src}
                    type="button"
                    onClick={() => {
                      setLeadSource(src);
                      setCompletedAttempts([]); // Clean slate for new lead source call
                    }}
                    className={`px-3 py-1 text-xs font-bold rounded-md transition-all cursor-pointer ${
                      isSelected
                        ? 'bg-[#BA6A36] text-white shadow-xs'
                        : 'text-[#E6C8B7] hover:text-white hover:bg-[#1C3934]'
                    }`}
                  >
                    {src}
                  </button>
                );
              })}
            </div>
          </div>

          <div className="text-xs text-[#E6C8B7]/90 italic font-medium">
            {leadSource === 'Bark' && 'Bark rule: Confirm own home & ask ZIP code early. 3 save attempts required.'}
            {leadSource === 'Angi' && 'Angi rule: At least 1 genuine save attempt required before callback.'}
            {leadSource === 'Thumbtack' && 'Thumbtack rule: 3 or more genuine save attempts required before callback.'}
          </div>
        </div>

        {/* 1. Simple Save Attempt Tracker Tabs */}
        <section aria-label="Lead Save Attempt Tracker">
          <SaveAttemptTracker
            leadSource={leadSource}
            completedAttempts={completedAttempts}
            onToggleAttempt={handleToggleSaveAttempt}
            onResetAttempts={handleResetSaveAttempts}
          />
        </section>

        {/* 2. Step-by-Step Guided Call Flow from Beginning to End */}
        <section aria-label="Guided Call Flow">
          <GuidedCallFlow leadSource={leadSource} />
        </section>

        {/* 3. Customer Response Helper (What did the customer just say?) */}
        <section aria-label="Customer Response Helper">
          <CustomerResponseHelper
            leadSource={leadSource}
            onRecordSaveAttempt={(_reason) => {
              setCompletedAttempts((prev) => {
                const nextAttempt = [1, 2, 3].find((n) => !prev.includes(n));
                return nextAttempt ? [...prev, nextAttempt] : prev;
              });
            }}
          />
        </section>

        {/* 4. Trainee Performance Dashboard (Unique per-trainee coaching insights & In-UI Deletion) */}
        <section aria-label="Trainee Performance Dashboard">
          <SimpleDashboard
            logs={callLogs}
            onAddLog={handleAddLog}
            onDeleteLog={handleDeleteLog}
            onDeleteTrainee={handleDeleteTrainee}
            onClearAllLogs={handleClearAllLogs}
            activeTrainee={activeTrainee}
            onSelectTrainee={(name) => setActiveTrainee(name)}
            currentLeadSource={leadSource}
          />
        </section>
      </main>

      {/* App Footer */}
      <footer className="bg-[#1C3934] text-[#E6C8B7] text-xs py-4 border-t border-[#C3955B]/30 mt-auto">
        <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-left">
          <div>
            <span className="font-bold text-[#F9EDF0]">VoiceLab Call Companion</span> — One-pager for Homeaglow trainees.
          </div>
          <div className="text-[11px] text-[#E6C8B7]/70">
            Based on the NLS Call Flow Guide. 75%+ score represents a passing call.
          </div>
        </div>
      </footer>
    </div>
  );
}

// ===== components/ProgressTracker.tsx =====




interface ProgressTrackerProps {
  reflections: CallReflection[];
  onSaveReflection: (reflection: Omit<CallReflection, 'id' | 'timestamp'>) => void;
  onDeleteReflection: (id: string) => void;
  currentLeadSource: LeadSource;
  currentSaveAttempts: number;
}

const COMMON_SKILL_FOCUSES = [
  'Verbatim Recording Notice & Intro',
  'One Question at a Time Discovery',
  'Playing Back Motivation in Customer Words',
  'Full Math Breakdown Before Asking to Book',
  'Objection Acknowledgment & Clarifying Question',
  'Callback Save Attempt Before Scheduling',
  'Safe Policy Boundary (No Guessing)'
];

const ProgressTracker: React.FC<ProgressTrackerProps> = ({
  reflections,
  onSaveReflection,
  onDeleteReflection,
  currentLeadSource,
  currentSaveAttempts
}) => {
  const [highlight, setHighlight] = useState('');
  const [opportunity, setOpportunity] = useState('');
  const [scoreInput, setScoreInput] = useState<string>('');
  const [skillFocus, setSkillFocus] = useState('');
  const [leadSource, setLeadSource] = useState<LeadSource>(currentLeadSource);

  // Compute metrics
  const totalCalls = reflections.length;
  const scoredReflections = reflections.filter((r) => typeof r.score === 'number' && !isNaN(r.score));
  const scoredCount = scoredReflections.length;
  const averageScore = scoredCount > 0
    ? Math.round(scoredReflections.reduce((sum, r) => sum + (r.score || 0), 0) / scoredCount)
    : 0;
  const passingScoresCount = scoredReflections.filter((r) => (r.score || 0) >= 75).length;
  const passRatePercent = scoredCount > 0 ? Math.round((passingScoresCount / scoredCount) * 100) : 0;

  const handleSubmit = (e: React.FormEvent) => {
    e.preventDefault();
    if (!highlight.trim() || !opportunity.trim()) return;

    const parsedScore = scoreInput.trim() !== '' ? Number(scoreInput) : undefined;

    onSaveReflection({
      leadSource,
      highlight: highlight.trim(),
      opportunity: opportunity.trim(),
      score: parsedScore !== undefined && !isNaN(parsedScore) ? Math.min(100, Math.max(0, parsedScore)) : undefined,
      skillFocus: skillFocus.trim() || undefined,
      saveAttemptsCount: currentSaveAttempts
    });

    // Reset inputs
    setHighlight('');
    setOpportunity('');
    setScoreInput('');
    setSkillFocus('');
  };

  return (
    <div className="space-y-6">
      {/* Metrics Banner */}
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div className="bg-[#1C3934] text-[#F9EDF0] p-4 rounded-xl border border-[#C3955B]/40 shadow-xs">
          <div className="text-[11px] uppercase tracking-wider text-[#E6C8B7] font-semibold">
            Total Calls Logged
          </div>
          <div className="text-3xl font-black mt-1 font-mono text-[#F9EDF0]">
            {totalCalls}
          </div>
          <div className="text-[10px] text-[#E6C8B7]/70 mt-0.5">
            Personal reflection sessions
          </div>
        </div>

        <div className="bg-[#1C3934] text-[#F9EDF0] p-4 rounded-xl border border-[#C3955B]/40 shadow-xs">
          <div className="text-[11px] uppercase tracking-wider text-[#E6C8B7] font-semibold">
            Average Score
          </div>
          <div className="text-3xl font-black mt-1 font-mono text-[#F9EDF0]">
            {scoredCount > 0 ? `${averageScore}%` : '—'}
          </div>
          <div className="text-[10px] text-[#E6C8B7]/70 mt-0.5">
            Based on {scoredCount} scored calls
          </div>
        </div>

        <div className="bg-[#1C3934] text-[#F9EDF0] p-4 rounded-xl border border-[#C3955B]/40 shadow-xs">
          <div className="text-[11px] uppercase tracking-wider text-[#E6C8B7] font-semibold">
            Passed Calls (75%+)
          </div>
          <div className="text-3xl font-black mt-1 font-mono text-emerald-300">
            {passingScoresCount}
          </div>
          <div className="text-[10px] text-[#E6C8B7]/70 mt-0.5">
            {scoredCount > 0 ? `${passRatePercent}% pass rate` : '75% is pass benchmark'}
          </div>
        </div>

        <div className="bg-[#1C3934] text-[#F9EDF0] p-4 rounded-xl border border-[#C3955B]/40 shadow-xs">
          <div className="text-[11px] uppercase tracking-wider text-[#E6C8B7] font-semibold">
            Readiness Rule
          </div>
          <div className="text-sm font-bold mt-1 text-[#E6C8B7] leading-tight">
            70% Pass Rate to Go-Live
          </div>
          <div className="text-[10px] text-[#E6C8B7]/70 mt-0.5">
            Trainer reviews readiness
          </div>
        </div>
      </div>

      {/* VoiceLab Scoring Rule Callout */}
      <div className="bg-[#E6C8B7]/30 border border-[#C3955B]/40 rounded-xl p-3.5 text-xs text-[#261311] flex items-start gap-2.5">
        <HelpCircle className="w-4 h-4 text-[#BA6A36] shrink-0 mt-0.5" />
        <div>
          <span className="font-bold text-[#1C3934]">VoiceLab Go-Live Standard: </span>
          A call passes at <strong className="font-bold">75% or higher</strong>. Trainees are considered ready for live phones when at least <strong className="font-bold">70% of their scored calls pass</strong> (calls where a customer asks to stop calling are excluded from the pass calculation). Your official score and transcripts are reviewed by your team lead and trainer in Training Admin.
        </div>
      </div>

      {/* Post-Call Reflection Form */}
      <div className="bg-white rounded-xl border border-[#E6C8B7] p-5 shadow-sm space-y-4">
        <div className="flex items-center gap-2 border-b border-[#E6C8B7] pb-3">
          <ClipboardList className="w-5 h-5 text-[#BA6A36]" />
          <div>
            <h3 className="text-base font-bold text-[#1C3934]">
              Save Post-Call Reflection
            </h3>
            <p className="text-xs text-[#261311]/70">
              Reflect immediately after each call: one highlight and one opportunity to improve.
            </p>
          </div>
        </div>

        <form onSubmit={handleSubmit} className="space-y-4">
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            {/* Lead Source */}
            <div>
              <label className="block text-xs font-bold text-[#1C3934] mb-1">
                Lead Source
              </label>
              <select
                value={leadSource}
                onChange={(e) => setLeadSource(e.target.value as LeadSource)}
                className="w-full text-xs p-2 rounded-lg border border-[#C3955B] bg-white text-[#261311] focus:outline-none focus:ring-1 focus:ring-[#BA6A36]"
              >
                <option value="Thumbtack">Thumbtack</option>
                <option value="Angi">Angi</option>
                <option value="Bark">Bark</option>
              </select>
            </div>

            {/* Optional Score */}
            <div>
              <label className="block text-xs font-bold text-[#1C3934] mb-1">
                Optional Call Score (0 - 100%)
              </label>
              <input
                type="number"
                min="0"
                max="100"
                value={scoreInput}
                onChange={(e) => setScoreInput(e.target.value)}
                placeholder="e.g. 85 (75% = pass)"
                className="w-full text-xs p-2 rounded-lg border border-[#C3955B] bg-white text-[#261311] focus:outline-none focus:ring-1 focus:ring-[#BA6A36]"
              />
            </div>

            {/* Optional Skill Focus */}
            <div>
              <label className="block text-xs font-bold text-[#1C3934] mb-1">
                Skill Focus (Optional)
              </label>
              <input
                type="text"
                list="skill-focus-options"
                value={skillFocus}
                onChange={(e) => setSkillFocus(e.target.value)}
                placeholder="e.g. Objection handling, ETF clarity"
                className="w-full text-xs p-2 rounded-lg border border-[#C3955B] bg-white text-[#261311] focus:outline-none focus:ring-1 focus:ring-[#BA6A36]"
              />
              <datalist id="skill-focus-options">
                {COMMON_SKILL_FOCUSES.map((focus) => (
                  <option key={focus} value={focus} />
                ))}
              </datalist>
            </div>
          </div>

          {/* Highlight */}
          <div>
            <label className="block text-xs font-bold text-[#1C3934] mb-1 flex items-center gap-1">
              <Sparkles className="w-3.5 h-3.5 text-emerald-700" />
              <span>Highlight: What went well? *</span>
            </label>
            <textarea
              required
              rows={2}
              value={highlight}
              onChange={(e) => setHighlight(e.target.value)}
              placeholder="e.g. Broke down the 6-month commitment and $105 cancellation fee clearly before asking for the booking. Customer thanked me for transparency."
              className="w-full text-xs sm:text-sm p-2.5 rounded-lg border border-[#C3955B] focus:border-[#BA6A36] focus:outline-none bg-[#F9EDF0]/30 text-[#261311]"
            />
          </div>

          {/* Opportunity */}
          <div>
            <label className="block text-xs font-bold text-[#1C3934] mb-1 flex items-center gap-1">
              <Target className="w-3.5 h-3.5 text-[#BA6A36]" />
              <span>Opportunity: What will I try next time? *</span>
            </label>
            <textarea
              required
              rows={2}
              value={opportunity}
              onChange={(e) => setOpportunity(e.target.value)}
              placeholder="e.g. On Thumbtack, remember to attempt at least 3 genuine callback saves with new reasons rather than conceding after the first 'need to think'."
              className="w-full text-xs sm:text-sm p-2.5 rounded-lg border border-[#C3955B] focus:border-[#BA6A36] focus:outline-none bg-[#F9EDF0]/30 text-[#261311]"
            />
          </div>

          <div className="flex items-center justify-between pt-1">
            <span className="text-[11px] text-[#261311]/60 italic">
              * Highlight and opportunity are required for reflection.
            </span>
            <button
              type="submit"
              className="bg-[#BA6A36] hover:bg-[#BA6A36]/90 text-[#F9EDF0] px-4 py-2 rounded-lg text-xs font-bold shadow-xs transition-colors cursor-pointer"
            >
              Save Reflection
            </button>
          </div>
        </form>
      </div>

      {/* Reflections Log (Reverse Chronological Order) */}
      <div className="space-y-3">
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-2">
            <History className="w-4 h-4 text-[#1C3934]" />
            <h4 className="text-sm font-extrabold text-[#1C3934] uppercase tracking-wider">
              Reflection History ({reflections.length})
            </h4>
          </div>
          <span className="text-xs text-[#261311]/60">Saved locally in your browser</span>
        </div>

        {reflections.length === 0 ? (
          <div className="p-8 text-center bg-white rounded-xl border border-[#E6C8B7] text-[#261311]/60 text-xs">
            No reflections saved yet. After your next call in VoiceLab, record your highlight and opportunity above.
          </div>
        ) : (
          <div className="space-y-3">
            {reflections.map((r) => {
              const isPassing = typeof r.score === 'number' && r.score >= 75;
              const dateStr = new Date(r.timestamp).toLocaleDateString(undefined, {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
              });

              return (
                <div
                  key={r.id}
                  className="bg-white rounded-xl border border-[#E6C8B7] p-4 shadow-xs space-y-2.5 relative group"
                >
                  <div className="flex flex-wrap items-center justify-between gap-2 border-b border-[#E6C8B7]/60 pb-2">
                    <div className="flex items-center gap-2">
                      <span className="font-bold text-xs bg-[#1C3934] text-[#F9EDF0] px-2 py-0.5 rounded">
                        {r.leadSource}
                      </span>
                      {typeof r.score === 'number' && (
                        <span
                          className={`text-xs font-black px-2 py-0.5 rounded flex items-center gap-1 ${
                            isPassing
                              ? 'bg-emerald-100 text-emerald-800 border border-emerald-300'
                              : 'bg-amber-100 text-amber-900 border border-amber-300'
                          }`}
                        >
                          <Trophy className="w-3 h-3" />
                          <span>{r.score}% {isPassing ? '(Pass)' : ''}</span>
                        </span>
                      )}
                      {r.skillFocus && (
                        <span className="text-[11px] bg-[#E6C8B7]/40 text-[#261311] px-2 py-0.5 rounded font-medium">
                          Focus: {r.skillFocus}
                        </span>
                      )}
                      {typeof r.saveAttemptsCount === 'number' && (
                        <span className="text-[11px] text-[#261311]/70">
                          {r.saveAttemptsCount} save attempt{r.saveAttemptsCount !== 1 ? 's' : ''}
                        </span>
                      )}
                    </div>

                    <div className="flex items-center gap-2 text-xs text-[#261311]/50">
                      <span>{dateStr}</span>
                      <button
                        type="button"
                        onClick={() => onDeleteReflection(r.id)}
                        className="text-red-500 hover:text-red-700 p-1 rounded hover:bg-red-50 transition-colors cursor-pointer"
                        title="Delete reflection"
                      >
                        <Trash2 className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                    <div className="bg-[#F9EDF0]/60 p-2.5 rounded-lg border border-[#E6C8B7]/60">
                      <div className="font-bold text-emerald-900 mb-0.5 flex items-center gap-1">
                        <CheckCircle2 className="w-3 h-3 text-emerald-700" />
                        Highlight:
                      </div>
                      <p className="text-[#261311] leading-relaxed">{r.highlight}</p>
                    </div>

                    <div className="bg-[#E6C8B7]/20 p-2.5 rounded-lg border border-[#C3955B]/40">
                      <div className="font-bold text-[#BA6A36] mb-0.5 flex items-center gap-1">
                        <Target className="w-3 h-3 text-[#BA6A36]" />
                        Opportunity to Try:
                      </div>
                      <p className="text-[#261311] leading-relaxed">{r.opportunity}</p>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Storage Clarification Footer */}
      <div className="text-[11px] text-[#261311]/60 flex items-start gap-1.5 p-3 bg-[#F9EDF0] border border-[#E6C8B7] rounded-lg">
        <AlertCircle className="w-4 h-4 text-[#C3955B] shrink-0 mt-0.5" />
        <span>
          <strong>Storage Notice:</strong> All reflections are stored in your browser's local storage for your personal self-coaching and shift continuity. This app has no external database and does not sync with trainers or other devices.
        </span>
      </div>
    </div>
  );
};

</script>
